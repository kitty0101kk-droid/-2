<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>旅行手帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<style>
:root{
  --paper:#FFFCF6; --white:#FFFFFF; --sand:#F3EBDC;
  --ink:#3E3A39; --ink-soft:#6F6A67;
  --coral:#F2A497; --yellow:#F6D27A; --blue:#A8D3E6; --green:#B9DAA5;
  --r:24px; --bounce:cubic-bezier(.34,1.56,.64,1);
  --font:'Huninn','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--paper);scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font:400 16px/1.65 var(--font);font-synthesis:none;-webkit-text-size-adjust:100%;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--paper)}
body.lock{overflow:hidden}
h1,h2,h3,h4,p,ol,ul{margin:0;padding:0}
ol,ul{list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px dashed var(--ink);outline-offset:3px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mut{color:var(--ink-soft)}
body:not(.editing) .edit-only{display:none!important}

.ill{display:block}
.ill *{fill:none;stroke:var(--ink);stroke-width:var(--sw,3);stroke-linejoin:round;stroke-linecap:round}
.ill .fc{fill:var(--coral)}.ill .fy{fill:var(--yellow)}.ill .fb{fill:var(--blue)}.ill .fg{fill:var(--green)}
.ill .fw{fill:var(--white)}.ill .fi{fill:var(--ink)}.ill .fn{fill:none}.ill .ns{stroke:none}
.ill .fs{fill:var(--sand)}

.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--paper);border-bottom:3px solid var(--ink)}
.nav-in{display:flex;align-items:center;gap:.5rem;padding-top:.55rem;padding-bottom:.55rem}
.nav.bottom{position:fixed;top:auto;bottom:0;left:0;right:0;border-bottom:0;border-top:3px solid var(--ink);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav.hide{display:none}
body.navb main{padding-bottom:calc(6rem + env(safe-area-inset-bottom,0px))}
body.navb #toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.mini.nb{width:30px;height:30px;font-size:.8rem;flex:none;margin-bottom:3px}
.fab{position:fixed;right:12px;top:40%;z-index:55;width:48px;height:48px;border:3px solid var(--ink);border-radius:50%;background:var(--yellow);box-shadow:0 3px 0 var(--ink);display:none;place-items:center;touch-action:none;font-size:1.2rem;padding:0;line-height:1}
.fab.on{display:grid}
.mini:disabled{opacity:.35;cursor:default}
.orglist{margin:.2rem 0}
.orgrow .txt{flex:1;min-width:0}
.legs li.leg{display:block;padding:.6rem 0;border-top:2px dotted var(--ink)}
.legs li.leg:first-child{border-top:0}
.leg-top{display:flex;align-items:center;gap:.5rem}
.leg-top .eb{margin-left:auto}
.leg-top .tm{min-width:3rem;font-variant-numeric:tabular-nums}
.leg-route{overflow-wrap:anywhere;margin:.2rem 0}
.leg-note{font-size:.9rem;color:var(--ink-soft);white-space:pre-line;overflow-wrap:anywhere}
.leg-acts{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.4rem}
.leg-acts .maplink{margin:0}
.leg-chain{margin:.4rem 0 .2rem;font-size:.95rem;overflow-wrap:anywhere}
.leg-mode{display:flex;align-items:center;gap:.5rem;font-size:.85rem;color:var(--ink-soft)}
.leg-mode select{border:3px solid var(--ink);border-radius:999px;background:var(--white);padding:.05rem .6rem;color:var(--ink);min-width:0}
.leg-lbl{display:flex;flex-direction:column;gap:.15rem;margin-top:.5rem;font-size:.85rem;color:var(--ink-soft)}
.leg-ta{display:block;width:100%;min-height:4rem;resize:vertical;border:3px solid var(--ink);border-radius:16px;background:var(--paper);padding:.35rem .8rem;line-height:1.5;color:var(--ink)}
#transit .group{padding-bottom:.8rem}
#nav{display:flex;gap:.4rem;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none;padding:2px 2px 5px}
#nav::-webkit-scrollbar{display:none}
#nav a{flex:none;text-decoration:none;border:3px solid var(--ink);border-radius:999px;padding:.12rem .85rem;background:var(--white);font-size:.95rem;line-height:1.5;box-shadow:0 3px 0 var(--ink)}
#nav a.on{background:var(--yellow)}
.btn{border:3px solid var(--ink);border-radius:999px;background:var(--white);padding:.25rem 1rem;line-height:1.5;box-shadow:0 3px 0 var(--ink);transition:transform .15s var(--bounce),box-shadow .15s}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.btn.primary{background:var(--coral)}
.btn.ok{background:var(--green)}
.btn.danger{background:var(--white)}
.btn.sm{padding:.1rem .8rem;font-size:.9rem}
#editBtn{flex:none;margin-bottom:3px}
.sync{flex:none;width:16px;height:16px;border:3px solid var(--ink);border-radius:50%;background:var(--sand);margin-bottom:3px}
.sync[data-s="live"]{background:var(--green)}
.sync[data-s="wait"]{background:var(--yellow)}
.sync[data-s="err"],.sync[data-s="ro"]{background:var(--coral)}
.hint{margin-top:1rem;border:3px dashed var(--ink);border-radius:18px;padding:.5rem .9rem;background:var(--yellow);font-size:.9rem}

main{padding-top:1.2rem;padding-bottom:calc(3rem + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:2.2rem}
.sec{scroll-margin-top:84px;display:flex;flex-direction:column;gap:1rem}
.sec-h{display:flex;align-items:center;gap:.7rem;font-size:1.4rem;line-height:1.3;font-weight:400}
.sec-h .ico{width:48px;height:48px;flex:none;border:3px solid var(--ink);border-radius:16px;display:grid;place-items:center}
.sec-h .ico svg{width:34px;height:34px;--sw:2.5}
.sec-sub{font-size:.9rem;color:var(--ink-soft);margin-top:-.5rem}
.card{background:var(--white);border:3px solid var(--ink);border-radius:var(--r)}

.hero{overflow:hidden;background:var(--paper)}
.hero-ill{width:100%;height:auto;border-bottom:3px solid var(--ink)}
.hero-body{padding:1.1rem 1.1rem 1.3rem;display:flex;flex-direction:column;gap:.7rem}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{border:2px solid var(--ink);border-radius:999px;padding:0 .7rem;font-size:.85rem;background:var(--blue);line-height:1.6}
.chip.y{background:var(--yellow)}
.hero h1{font-size:clamp(1.7rem,7.4vw,2.5rem);line-height:1.25;font-weight:400;text-wrap:balance}
.tagline{color:var(--ink-soft)}
.cd-label{font-size:.85rem;color:var(--ink-soft)}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem}
.cd-t{border:3px solid var(--ink);border-radius:18px;text-align:center;padding:.4rem .2rem .3rem;min-width:0}
.cd-t b{display:block;font-weight:400;font-size:clamp(1.5rem,7.5vw,2.2rem);line-height:1.15;font-variant-numeric:tabular-nums}
.cd-t span{font-size:.8rem}
.cd-t:nth-child(1){background:var(--coral)}.cd-t:nth-child(2){background:var(--yellow)}
.cd-t:nth-child(3){background:var(--blue)}.cd-t:nth-child(4){background:var(--green)}
.cd-msg{grid-column:1/-1;border:3px solid var(--ink);border-radius:18px;background:var(--green);padding:.7rem 1rem;text-align:center;font-size:1.15rem}
.banner{display:flex;align-items:flex-start;gap:.6rem;border:3px solid var(--ink);border-radius:18px;background:var(--yellow);padding:.5rem .5rem .5rem .9rem;font-size:.9rem}
.banner p{flex:1;min-width:0}

.flight{overflow:hidden;position:relative}
.fl-top{display:flex;align-items:center;gap:.6rem;padding:.8rem 1rem .2rem;flex-wrap:wrap}
.dir{border:2px solid var(--ink);border-radius:999px;padding:0 .8rem;font-size:.9rem;background:var(--coral);line-height:1.6}
.dir.back{background:var(--blue)}
.fl-no{flex:1;min-width:0}
.fl-route{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:.4rem;padding:.4rem 1rem .9rem}
.ap{display:flex;flex-direction:column;min-width:0}
.ap b{font-weight:400;font-size:clamp(1.9rem,9vw,2.6rem);line-height:1.1;letter-spacing:.04em}
.ap span{font-size:.85rem;color:var(--ink-soft)}
.ap.r{text-align:right}
.fl-arc{width:100%;height:auto;max-width:150px;margin:0 auto}
.perf{border-top:3px dashed var(--ink);position:relative}
.perf::before,.perf::after{content:"";position:absolute;top:-13px;width:24px;height:24px;border:3px solid var(--ink);border-radius:50%;background:var(--paper)}
.perf::before{left:-15px}.perf::after{right:-15px}
.fl-meta{display:grid;grid-template-columns:1fr 1fr;gap:.6rem 1rem;padding:.9rem 1rem 1rem}
.fl-meta small,.kv small{display:block;font-size:.8rem;color:var(--ink-soft);line-height:1.4}
.fl-meta b,.kv b{font-weight:400}
.fl-note{grid-column:1/-1;font-size:.9rem;white-space:pre-line}
.eb{display:inline-flex;gap:.3rem;flex:none}
.mini{width:34px;height:34px;border:3px solid var(--ink);border-radius:50%;background:var(--white);padding:0;line-height:1;font-size:.95rem;display:grid;place-items:center}
.mini.x{background:var(--coral)}
.fl-top .eb{margin-left:auto}
.add{align-self:flex-start;border:3px dashed var(--ink);border-radius:999px;background:var(--paper);padding:.25rem 1rem;line-height:1.5}

.daytabs{display:flex;gap:.5rem;overflow-x:auto;padding:4px 3px 8px;margin:0 -3px;scrollbar-width:none;scroll-snap-type:x proximity}
.daytabs::-webkit-scrollbar{display:none}
.dt{flex:none;scroll-snap-align:center;min-width:4.6rem;border:3px solid var(--ink);border-radius:20px;background:var(--white);padding:.25rem .5rem .3rem;text-align:center;line-height:1.35;box-shadow:0 4px 0 var(--ink)}
.dt small{display:block;font-size:.75rem;color:var(--ink-soft)}
.dt b{display:block;font-weight:400;font-size:1.15rem}
.dt[aria-selected="true"]{background:var(--yellow)}
.dt[aria-selected="true"] small{color:var(--ink)}
.dt.bounce{animation:boing .55s var(--bounce)}
.dt.addday{display:grid;place-content:center;background:var(--paper);border-style:dashed;font-size:1.4rem}
.day-head{display:flex;align-items:center;gap:.8rem;padding:.7rem .9rem;background:var(--blue)}
.day-ill{width:76px;flex:none;background:var(--paper);border:3px solid var(--ink);border-radius:18px;padding:4px}
.day-ill svg{width:100%;height:auto;--sw:2.5}
.day-head .t{flex:1;min-width:0}
.day-head small{font-size:.85rem}
.day-head h3{font-size:1.25rem;font-weight:400;line-height:1.35;overflow-wrap:anywhere}
.tl{margin-top:1.1rem}
.tl-i{display:grid;grid-template-columns:3.2rem 22px minmax(0,1fr);column-gap:.45rem;padding-bottom:1rem}
.tl-t{text-align:right;font-size:.95rem;line-height:1.9;font-variant-numeric:tabular-nums;padding-top:.45rem}
.rail{position:relative}
.rail::before{content:"";position:absolute;left:50%;top:0;bottom:-1rem;border-left:3px solid var(--ink);transform:translateX(-50%)}
.tl-i:last-child .rail::before{bottom:auto;height:32px}
.dot{position:absolute;left:50%;top:14px;width:20px;height:20px;margin-left:-10px;border:3px solid var(--ink);border-radius:50%;background:var(--white)}
.dot.must{background:var(--coral);width:24px;height:24px;margin-left:-12px;top:12px}
.tl-c{border:3px solid var(--ink);border-radius:18px;background:var(--white);padding:.55rem .8rem .65rem;min-width:0}
.tl-c.must{background:var(--yellow)}
.tl-tags{display:flex;gap:.35rem;flex-wrap:wrap;align-items:center;margin-bottom:.15rem}
.tl-c h4{font-weight:400;font-size:1.05rem;line-height:1.45;overflow-wrap:anywhere}
.tl-c p{font-size:.88rem;color:var(--ink-soft);white-space:pre-line;overflow-wrap:anywhere}
.tl-c.must p{color:var(--ink)}
.tl-c .eb{margin-top:.4rem}
.tag{border:2px solid var(--ink);border-radius:999px;padding:0 .6rem;font-size:.78rem;line-height:1.6;background:var(--sand)}
.bg-c{background:var(--coral)}.bg-y{background:var(--yellow)}.bg-b{background:var(--blue)}.bg-g{background:var(--green)}.bg-w{background:var(--white)}
.mustb{display:inline-flex;align-items:center;gap:.2rem;border:2px solid var(--ink);border-radius:999px;background:var(--coral);padding:0 .6rem 0 .4rem;font-size:.78rem;line-height:1.6;animation:wiggle 2.8s ease-in-out infinite}
.mustb svg{width:14px;height:14px;--sw:2}
.empty{border:3px dashed var(--ink);border-radius:var(--r);padding:1.2rem;text-align:center;color:var(--ink-soft)}
.pop-in{animation:pop .55s var(--bounce) both;animation-delay:calc(var(--i,0)*70ms)}
#daypanel.swap .day-head{animation:pop .5s var(--bounce) both}

.prog{display:flex;align-items:center;gap:.7rem;font-size:.9rem}
.prog .track{flex:1;height:18px;border:3px solid var(--ink);border-radius:999px;background:var(--white);overflow:hidden}
.prog .bar{height:100%;background:var(--green);border-right:3px solid var(--ink);transition:width .5s var(--bounce)}
.prog .bar[style*="width:0%"]{border-right:0}
.prog span{flex:none;font-variant-numeric:tabular-nums}
.group{padding:.8rem 1rem .5rem}
.group+.group{margin-top:-.4rem}
.group h3{font-weight:400;font-size:1rem;display:inline-block;border:2px solid var(--ink);border-radius:999px;padding:0 .8rem;background:var(--blue);line-height:1.6;margin-bottom:.3rem}
.rows li{display:flex;align-items:center;gap:.5rem;padding:.35rem 0;border-top:2px dotted var(--ink)}
.rows li:first-child{border-top:0}
.chk{display:flex;align-items:center;gap:.7rem;flex:1;min-width:0;cursor:pointer;position:relative}
.chk input{position:absolute;opacity:0;width:28px;height:28px;margin:0}
.box{flex:none;width:28px;height:28px;border:3px solid var(--ink);border-radius:10px;background:var(--white);display:grid;place-items:center}
.box svg{width:18px;height:18px;opacity:0;--sw:3.5}
.chk input:checked~.box{background:var(--green)}
.chk input:checked~.box svg{opacity:1}
.chk input:focus-visible~.box{outline:3px dashed var(--ink);outline-offset:3px}
.chk .txt{min-width:0;overflow-wrap:anywhere}
li.done .txt{color:var(--ink-soft);text-decoration:line-through;text-decoration-thickness:2px}
.box.boing{animation:boing .5s var(--bounce)}
.addrow{display:flex;gap:.5rem;flex-wrap:wrap;padding:.6rem 1rem 1rem;border-top:3px dashed var(--ink)}
.addrow input{flex:1 1 9rem;min-width:0;border:3px solid var(--ink);border-radius:999px;background:var(--paper);padding:.2rem .9rem}
.addrow input[name="cat"]{flex:0 1 6.5rem}
.listcard{overflow:hidden}
.nothing{padding:.9rem 1rem 0;color:var(--ink-soft);font-size:.9rem}
.rows li{flex-wrap:wrap}
.ph-strip{flex:0 0 100%;display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;padding:.1rem 0 .3rem 2.4rem}
body:not(.editing) .ph-strip:not(.has){display:none}
.ph-th{width:64px;height:64px;padding:0;border:3px solid var(--ink);border-radius:14px;overflow:hidden;background:var(--sand);flex:none}
.ph-th img{display:block;width:100%;height:100%;object-fit:cover}
img[data-ph]:not([src]){visibility:hidden}
.ph-add{border:3px dashed var(--ink);border-radius:999px;background:var(--paper);padding:0 .8rem;font-size:.85rem;line-height:1.7}
.ph-big{display:block;width:100%;max-height:60vh;object-fit:contain;border:3px solid var(--ink);border-radius:16px;background:var(--white);min-height:4rem}
.sec[hidden]{display:none}
.ph-file{max-width:100%;border:3px solid var(--ink);border-radius:999px;background:var(--blue);padding:0 .8rem;font-size:.85rem;line-height:1.7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rows li.sel{background:var(--paper);border-radius:12px}
.rows li.drop{background:var(--yellow);outline:3px dashed var(--ink);outline-offset:-3px;border-radius:12px}

.hotel{overflow:hidden}
.hotel-h{display:flex;align-items:center;gap:.7rem;background:var(--yellow);border-bottom:3px solid var(--ink);padding:.7rem 1rem}
.hotel-h h3{font-weight:400;font-size:1.15rem;line-height:1.4;flex:1;min-width:0;overflow-wrap:anywhere}
.nights{flex:none;border:2px solid var(--ink);border-radius:999px;background:var(--white);padding:0 .7rem;font-size:.85rem;line-height:1.6}
.hotel-b{padding:.9rem 1rem 1rem;display:flex;flex-direction:column;gap:.7rem}
.kvs{display:grid;grid-template-columns:1fr 1fr;gap:.6rem 1rem}
.kv{min-width:0}
.kv.w{grid-column:1/-1}
.kv b{overflow-wrap:anywhere}
.kv .acts{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.3rem}
.kv .acts .btn{padding:0 .8rem;font-size:.85rem;box-shadow:0 2px 0 var(--ink);text-decoration:none;display:inline-block}
.note{font-size:.9rem;white-space:pre-line;color:var(--ink-soft)}

footer{display:flex;flex-direction:column;align-items:center;gap:.6rem;text-align:center;padding-top:.5rem}
.cat{width:110px;height:auto}
footer p{font-size:.88rem;color:var(--ink-soft);max-width:30em}
.foot-btns{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center}
.gate{position:fixed;inset:0;z-index:200;background:var(--paper);display:grid;place-items:center;padding:20px}
.gate-card{width:100%;max-width:360px;background:var(--white);border:3px solid var(--ink);border-radius:var(--r);padding:1.4rem 1.2rem;display:flex;flex-direction:column;gap:.8rem;text-align:center}
.gate-card h1{font-size:1.7rem;font-weight:400;line-height:1.3}
.gate-card input{width:100%;border:3px solid var(--ink);border-radius:999px;background:var(--paper);padding:.35rem 1rem;text-align:center;font-size:1.2rem;letter-spacing:.3em}
#gmsg{min-height:1.4em;font-size:.9rem}
.maplink{display:inline-block;text-decoration:none;margin-top:.4rem;margin-right:.4rem;box-shadow:0 2px 0 var(--ink)}
.loc{overflow-wrap:anywhere}
.rows li.trrow{flex-wrap:wrap;gap:.4rem .6rem}
.trrow .tm{min-width:3rem;font-variant-numeric:tabular-nums}
.cards{display:flex;flex-direction:column;gap:.8rem}
.cards .group+.group{margin-top:0}
.gh{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.gh h3{margin-bottom:0}
.gh .eb{margin-left:auto}
.gh .cnt{font-size:.8rem;color:var(--ink-soft)}
.subadd{display:flex;gap:.5rem;padding:.5rem 0 .3rem;border-top:2px dotted var(--ink);margin-top:.2rem}
.subadd input{flex:1;min-width:0;border:3px solid var(--ink);border-radius:999px;background:var(--paper);padding:.1rem .8rem}
.subadd .btn{padding:0 .9rem;font-size:.9rem}
.newcat{display:flex;gap:.5rem;border:3px dashed var(--ink);border-radius:var(--r);padding:.6rem .8rem}
.newcat input{flex:1;min-width:0;border:3px solid var(--ink);border-radius:999px;background:var(--paper);padding:.2rem .9rem}

.scrim{position:fixed;inset:0;z-index:80;background:rgba(62,58,57,.38);display:flex;align-items:center;justify-content:center;padding:16px}
.scrim[hidden]{display:none}
.sheet{width:100%;max-width:520px;max-height:86vh;max-height:86dvh;overflow-y:auto;background:var(--paper);border:3px solid var(--ink);border-radius:28px;padding:1.1rem 1.2rem 1.2rem;animation:sheetPop .45s var(--bounce)}
.sheet h3{font-weight:400;font-size:1.3rem;margin-bottom:.8rem}
/* 修正：欄位不再撐破格子、邊框不再互相重疊 */
.sheet form{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.8rem 1rem}
.fld{grid-column:1/-1;display:flex;flex-direction:column;gap:.15rem;min-width:0;max-width:100%}
.fld.half{grid-column:auto}
.fld>span{font-size:.85rem;color:var(--ink-soft)}
.fld input,.fld select,.fld textarea,.sheet textarea{display:block;width:100%;min-width:0;max-width:100%;border:3px solid var(--ink);border-radius:16px;background:var(--white);padding:.3rem .8rem;line-height:1.5;text-align:left}
.fld input[type="date"],.fld input[type="time"],.fld input[type="datetime-local"]{-webkit-appearance:none;appearance:none;min-height:2.9rem;overflow:hidden}
.fld input::-webkit-date-and-time-value{text-align:left;min-height:1.5em;margin:0}
.fld input::-webkit-datetime-edit{padding:0}
.fld select{text-overflow:ellipsis;min-height:2.9rem}
.fld textarea,.sheet textarea{resize:vertical;min-height:5.5rem}
.crow{grid-column:1/-1;display:flex;align-items:center;gap:.7rem;cursor:pointer;position:relative}
.crow input{position:absolute;opacity:0;width:28px;height:28px;margin:0}
.crow input:checked~.box{background:var(--coral)}
.crow input:checked~.box svg{opacity:1}
.crow input:focus-visible~.box{outline:3px dashed var(--ink);outline-offset:3px}
.sheet-btns{grid-column:1/-1;display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-top:.3rem}
.sheet-btns .sp{flex:1}
.sheet .msg{font-size:.9rem;margin-top:.6rem;min-height:1.4em}
.sheet form .msg{grid-column:1/-1;margin-top:0}
.sheet p.mut{font-size:.9rem;margin-bottom:.6rem}


#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;display:flex;align-items:center;gap:.7rem;border:3px solid var(--ink);border-radius:999px;background:var(--yellow);padding:.3rem .5rem .3rem 1.1rem;max-width:calc(100vw - 32px);animation:pop .45s var(--bounce)}
#toast[hidden]{display:none}
#toast button{border:3px solid var(--ink);border-radius:999px;background:var(--white);padding:0 .8rem;line-height:1.5}

.sun-rays{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite}
.sun-core{transform-box:fill-box;transform-origin:center;animation:breathe 4s ease-in-out infinite}
.cloud{animation:drift 9s ease-in-out infinite alternate}
.cloud.b{animation-duration:12s;animation-delay:-4s}
.train{transform:translateX(150px);animation:run 20s linear infinite}
.plane{animation:bob 3.6s ease-in-out infinite}
.tree{transform-box:fill-box;transform-origin:50% 100%;animation:sway 5s ease-in-out infinite}
.snow{fill:var(--white);animation:snow linear infinite}
.paw{transform-box:fill-box;transform-origin:50% 100%;animation:wave 2.4s ease-in-out infinite}
.bobber{animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(26px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes run{from{transform:translateX(-140px)}to{transform:translateX(500px)}}
@keyframes snow{0%{transform:translate(0,-10px)}100%{transform:translate(-22px,230px)}}
@keyframes sway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
@keyframes wave{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(14deg)}}
@keyframes wiggle{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes pop{0%{transform:translateY(16px) scale(.9);opacity:0}60%{transform:translateY(-3px) scale(1.03);opacity:1}100%{transform:none;opacity:1}}
@keyframes boing{0%{transform:scale(1)}30%{transform:scale(.86,1.12)}55%{transform:scale(1.12,.92)}80%{transform:scale(.97)}100%{transform:scale(1)}}
@keyframes sheetPop{0%{transform:scale(.8);opacity:0}60%{transform:scale(1.03);opacity:1}100%{transform:none;opacity:1}}
@keyframes flash{0%,100%{box-shadow:0 0 0 0 transparent}30%{box-shadow:0 0 0 6px var(--coral)}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  .snow{display:none}
}
@media (max-width:380px){.fl-route{grid-template-columns:auto 1fr auto}.kvs{grid-template-columns:1fr}.tl-i{grid-template-columns:2.8rem 22px minmax(0,1fr)}}

function normalize(o){
  if(!o||typeof o!=='object'||!o.trip) return null;
  const arr=k=>Array.isArray(o[k])?o[k]:[];
  const fix=a=>a.map(x=>({...x,id:x.id||uid()}));
  return {sample:!!o.sample,trip:{title:'',tagline:'',depart:'',back:'',...o.trip},flights:fix(arr('flights')),
    days:arr('days').map(d=>({...d,id:d.id||uid(),items:fix(Array.isArray(d.items)?d.items:[])})),
    hotels:fix(arr('hotels')),todos:fix(arr('todos')),todoCats:Array.isArray(o.todoCats)?o.todoCats.slice():[...new Set(arr('todos').map(i=>i.cat||'未分類'))],prep:fix(arr('prep')),pack:fix(arr('pack'))};
}
function load(){try{const r=localStorage.getItem(KEY);if(r){const n=normalize(JSON.parse(r));if(n)return n}}catch(e){}return sample()}
let S=load();
let saveWarned=false;
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){if(!saveWarned){saveWarned=true;toast('這個瀏覽器無法儲存，重新整理後資料會消失。可到頁尾「備份與還原」複製備份。')}}
  push();
}
// unlocked＝可編輯：未設定 Firebase 時為本機模式（直接可編輯）；設定後需用允許名單內的 Google 帳號登入
const ui={editing:false,day:null,lastCat:'其他',unlocked:!FB_ON,user:null};
let auth=null,AU=null;
/* 照片：縮圖後存成獨立文件（雲端：Firestore photos 集合；本機模式：localStorage） */
const phCache=new Map(),phLoading=new Set();
let phSel=null;
const MAXF=650*1024; // 非圖片檔上限（Firestore 單一文件約 1MB）
let PH={

  get:async id=>{try{return localStorage.getItem('tabi-photo-'+id)}catch(e){return null}}
};

/* ---------- 共同編輯同步 ---------- */
let dbDoc=null,syncState='local',lastJson='',remoteJson='',deferred=null,pushT=0,firstSnap=true;
const SYNC_TXT={local:'尚未連線，目前只存在這台裝置（登入 Google 後可跨裝置同步）',wait:'同步中…',live:'已連線：所有人的修改會即時同步',ro:'這個 Google 帳號沒有編輯權限，修改不會同步',err:'同步失敗，會再自動重試'};
function setSync(s){
  syncState=s;
  const d=$('#syncDot');if(d){d.dataset.s=s;d.title='同步狀態：'+SYNC_TXT[s];d.setAttribute('aria-label','同步狀態：'+SYNC_TXT[s])}
  const t=$('#syncTxt');if(t)t.textContent=SYNC_TXT[s];
}
function push(){
  if(!dbDoc||!ui.unlocked||firstSnap)return;
  clearTimeout(pushT);
  pushT=setTimeout(async()=>{
    const json=JSON.stringify(S);
    if(json===lastJson)return;
    setSync('wait');
    try{
      await dbDoc.set({json,at:Date.now()});
      lastJson=json;remoteJson=json;setSync('live');
      if(JSON.stringify(S)!==json)push();
    }catch(e){
      if(/perm|denied|grant|auth/i.test((e&&e.code)||'')){
        setSync('ro');toast('沒有寫入權限，這次的修改沒有同步');
        if(remoteJson){lastJson=remoteJson;applyRemote(remoteJson,true)}
      }else{setSync('err');pushT=setTimeout(push,5000)}
    }
  },500);
}
const busy=()=>{
  if(!$('#scrim').hidden)return true;
  const a=document.activeElement;
  return !!(a&&a.matches&&a.matches('main input[name="text"],main input[name="cat"],main input[name="newcat"],main textarea.leg-ta')&&a.value);
};
function applyRemote(json,force){
  if(json===JSON.stringify(S)){lastJson=json;return}
  if(!force&&ui.unlocked&&JSON.stringify(S)!==lastJson)return; // 自己還有沒送出的修改，以自己的為準
  if(!force&&busy()){deferred=json;setTimeout(flush,1500);return}
  let n=null;try{n=normalize(JSON.parse(json))}catch(e){}
  if(!n)return;
  S=n;lastJson=json;
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  renderAll();
}
function flush(){
  if(deferred==null)return;
  if(busy()){setTimeout(flush,1500);return}
  const j=deferred;deferred=null;applyRemote(j);
}
async function initSync(){
  if(!FB_ON){setSync('local');return}
  try{
    const B='https://www.gstatic.com/firebasejs/10.12.2/';
    const [{initializeApp},A,D]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')]);
    const app=initializeApp(FB);
    AU=A;auth=A.getAuth(app);
    A.setPersistence&&A.setPersistence(auth,A.browserLocalPersistence).catch(()=>{});
    const fdb=D.getFirestore(app);
    const ref=D.doc(fdb,'trips','main');
    PH={
      set:(id,d)=>D.setDoc(D.doc(fdb,'photos',id),{data:d,at:Date.now()}),
      get:async id=>{const s=await D.getDoc(D.doc(fdb,'photos',id));return s.exists()?s.data().data:null}
    };
    dbDoc={set:d=>D.setDoc(ref,d),onSnapshot:(ok,er)=>D.onSnapshot(ref,s=>ok({exists:s.exists(),data:()=>s.data()}),er)};
    A.onAuthStateChanged(auth,u=>{
      ui.user=u;
      const em=u&&(u.email||'').toLowerCase();
      ui.unlocked=!!u&&(!EDITORS.length||EDITORS.map(x=>x.toLowerCase()).includes(em));
      if(!ui.unlocked&&ui.editing)setEditing(false);
      renderFoot();
      if(u&&!ui.unlocked){setSync('ro')}
      else if(ui.unlocked){setSync('live');push()}
    });
    setSync('wait');
    const timer=setTimeout(()=>{if(firstSnap)setSync('local')},10000);
    dbDoc.onSnapshot(snap=>{
      clearTimeout(timer);
      const d=snap.exists?snap.data():null;
      if(d&&typeof d.json==='string'){
        remoteJson=d.json;
        if(firstSnap){firstSnap=false;applyRemote(d.json,true)}else applyRemote(d.json);
        if(syncState!=='ro'&&syncState!=='wait')setSync('live');
      }else{
        firstSnap=false;
        setSync('live');
        if(ui.unlocked)push();
      }
    },()=>{setSync('local')});
  }catch(e){setSync('local')}
}

/* ---------- 工具 ---------- */
const parseD=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||'');return m?new Date(+m[1],+m[2]-1,+m[3]):null};
const md=s=>{const d=parseD(s);return d?`${d.getMonth()+1}/${d.getDate()}`:''};
const wk=s=>{const d=parseD(s);return d?'週'+'日一二三四五六'[d.getDay()]:''};
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const nl=s=>esc(s);
const mapUrl=a=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(a);
const mapBtn=a=>`<a class="btn sm maplink" href="${esc(mapUrl(a))}" target="_blank" rel="noopener">開啟地圖</a>`;
const TR={'飛機':'bg-b','電車':'bg-g','新幹線':'bg-c','地鐵':'bg-g','巴士':'bg-y','計程車':'bg-y','租車':'bg-y','渡輪':'bg-b','步行':'bg-w','其他':''};
const TRS=Object.keys(TR);
const sortedDays=()=>[...S.days].sort((a,b)=>(a.date||'').localeCompare(b.date||''));
const sortedItems=d=>[...d.items].map((x,i)=>[x,i]).sort((a,b)=>((a[0].time||'99:99').localeCompare(b[0].time||'99:99'))||a[1]-b[1]).map(x=>x[0]);

let toastTimer=0;
function toast(msg,undo){
  const t=$('#toast');t.innerHTML=`<span>${esc(msg)}</span>${undo?'<button type="button" id="undoBtn">復原</button>':''}`;t.hidden=false;
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.hidden=true},undo?6000:3200);
  if(undo)$('#undoBtn').onclick=()=>{undo();t.hidden=true};
}
function mutate(fn,msg,withUndo){
  const snap=JSON.stringify(S);fn();save();renderAll();
  if(msg)toast(msg,withUndo?()=>{S=normalize(JSON.parse(snap));save();renderAll()}:null);
}
async function copyText(t){
  try{await navigator.clipboard.writeText(t);return true}catch(e){
    try{const ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();return ok}catch(e2){return false}
  }
}

function dayIll(d,idx){
  const trs=d.items.map(i=>i.tr);
  if(trs.includes('新幹線'))return SVG.day.train;
  if(trs.includes('巴士')&&trs.filter(t=>t==='巴士').length>=2)return SVG.day.bus;
  return [SVG.day.torii,SVG.day.fuji,SVG.day.lantern,SVG.day.train,SVG.day.bus][idx%5];
}

const editBtns=(act,id,extra='')=>`<span class="eb edit-only"><button type="button" class="mini" data-act="edit-${act}" data-id="${id}" ${extra} aria-label="編輯">✎</button></span>`;
const secHead=(id,title,sub)=>`<h2 class="sec-h"><span class="ico ${({flights:'bg-b',days:'bg-c',transit:'bg-b',todo:'bg-y',hotels:'bg-y',prep:'bg-g',pack:'bg-c'})[id]}">${SVG.ico[id]}</span>${esc(title)}</h2>${sub?`<p class="sec-sub">${esc(sub)}</p>`:''}`;

function renderHero(){
  const t=S.trip,dep=t.depart?t.depart.slice(0,10):'';
  const range=dep&&t.back?`${md(dep)}（${wk(dep)}）– ${md(t.back)}（${wk(t.back)}）`:'';
  const nd=dep&&t.back?Math.round((parseD(t.back)-parseD(dep))/864e5):0;
  $('#top').innerHTML=`<div class="card hero">${SVG.hero}<div class="hero-body">
    ${S.sample?`<div class="banner"><p>目前是範例行程。按右上角「編輯」，就能把標題、航班、行程都改成你自己的。</p><button type="button" class="mini edit-only" data-act="dismiss" aria-label="關閉提示">✕</button></div>`:''}
    <div class="chips">${range?`<span class="chip y">${esc(range)}</span>`:''}${nd>0?`<span class="chip">${nd+1} 天 ${nd} 夜</span>`:''}</div>
    <h1>${esc(t.title||'我的旅行')}</h1>
    ${t.tagline?`<p class="tagline">${esc(t.tagline)}</p>`:''}
    <div class="cd-label" id="cdl">出發倒數</div><div class="cd" id="cd" role="timer" aria-live="off"></div>
    <button type="button" class="btn sm edit-only" style="align-self:flex-start" data-act="edit-trip">✎ 修改標題與日期</button>
  </div></div>`;
  tick();
}
function tick(){
  const cd=$('#cd');if(!cd)return;
  const dep=new Date(S.trip.depart),now=new Date();
  const back=parseD(S.trip.back);if(back)back.setHours(23,59,59);
  if(isNaN(dep)){$('#cdl').textContent='';cd.innerHTML='<div class="cd-msg">編輯模式裡設定出發時間，就會開始倒數</div>';return}
  if(now<dep){
    const s=Math.floor((dep-now)/1000);
    $('#cdl').textContent='出發倒數';
    cd.innerHTML=[['天',Math.floor(s/86400)],['時',Math.floor(s%86400/3600)],['分',Math.floor(s%3600/60)],['秒',s%60]].map(([l,v])=>`<div class="cd-t"><b>${pad(v)}</b><span>${l}</span></div>`).join('');
  }else if(back&&now<=back){
    const a=new Date(dep);a.setHours(0,0,0,0);const b=new Date(now);b.setHours(0,0,0,0);
    $('#cdl').textContent='旅行進行中';cd.innerHTML=`<div class="cd-msg">旅行中！今天是第 ${Math.round((b-a)/864e5)+1} 天</div>`;
  }else{$('#cdl').textContent='';cd.innerHTML='<div class="cd-msg">旅程結束，歡迎回家</div>'}
}

function renderFlights(){
  const fl=[...S.flights].sort((a,b)=>((a.date||'')+(a.dep||'')).localeCompare((b.date||'')+(b.dep||'')));
  $('#flights').innerHTML=secHead('flights','航班')+
  (fl.length?fl.map(f=>`<article class="card flight">
    <div class="fl-top"><span class="dir ${f.dir==='去程'?'':'back'}">${esc(f.dir)}</span><span class="fl-no">${esc(f.airline)} ${esc(f.no)}</span>${editBtns('flight',f.id)}</div>

    <div class="perf"></div>
    <div class="fl-meta"><div><small>起飛</small><b>${md(f.date)}（${wk(f.date)}）${esc(f.dep)}</b></div><div><small>抵達</small><b>${md(f.arrDate||f.date)}（${wk(f.arrDate||f.date)}）${esc(f.arr)}</b></div>${f.note?`<p class="fl-note">${nl(f.note)}</p>`:''}</div>

}

function renderDays(anim){
  const days=sortedDays(),box=$('#days');
  if(!$('#daytabs')){
    box.innerHTML=secHead('days','每日行程')+`<div class="daytabs" id="daytabs" role="tablist" aria-label="選擇日期"></div><div id="daypanel" role="tabpanel"></div>`;
  }
  const tabs=$('#daytabs'),panel=$('#daypanel'),sl=tabs.scrollLeft;
  if(!days.length){
    tabs.innerHTML=`<button type="button" class="dt addday edit-only" data-act="add-day" aria-label="新增一天">＋</button>`;
    panel.innerHTML='<p class="empty">還沒有行程。按右上角「編輯」，新增第一天。</p>';return;
  }
  if(!days.some(d=>d.id===ui.day))ui.day=days[0].id;
  tabs.innerHTML=days.map((d,i)=>`<button type="button" class="dt" role="tab" id="tab-${d.id}" aria-selected="${d.id===ui.day}" aria-controls="daypanel" data-act="day" data-id="${d.id}"><small>Day ${i+1}</small><b>${md(d.date)}</b><small>${wk(d.date)}</small></button>`).join('')+
    `<button type="button" class="dt addday edit-only" data-act="add-day" aria-label="新增一天">＋</button>`;
  tabs.scrollLeft=sl;
  const idx=days.findIndex(d=>d.id===ui.day),d=days[idx];
  panel.setAttribute('aria-labelledby','tab-'+d.id);
  panel.className=anim?'swap':'';
  const items=sortedItems(d);
  panel.innerHTML=`<div class="card day-head"><div class="day-ill">${dayIll(d,idx)}</div><div class="t"><small>Day ${idx+1} · ${md(d.date)}（${wk(d.date)}）</small><h3>${esc(d.title||'未命名的一天')}</h3></div>${editBtns('day',d.id)}</div>`+
  (items.length?`<ol class="tl">${items.map((x,i)=>`<li class="tl-i${anim?' pop-in':''}" id="it-${x.id}" style="--i:${i}">
    <time class="tl-t">${esc(x.time||'')}</time><span class="rail"><i class="dot${x.must?' must':''}"></i></span>
    <div class="tl-c${x.must?' must':''}"><div class="tl-tags">${x.tr?`<span class="tag ${TR[x.tr]??''}">${esc(x.tr)}</span>`:''}${x.must?`<span class="mustb">${SVG.star}必去</span>`:''}</div>
    <h4>${esc(x.title)}</h4>${x.addr?`<p class="loc">📍 ${esc(x.addr)}</p>`:''}${x.trNote?`<p>🚆 ${nl(x.trNote)}</p>`:''}${x.note?`<p>${nl(x.note)}</p>`:''}${x.addr?mapBtn(x.addr):''}${editBtns('item',x.id,`data-day="${d.id}"`)}</div></li>`).join('')}</ol>`:'<p class="empty" style="margin-top:1.1rem">這天還沒有安排。</p>')+
  `<button type="button" class="add edit-only" style="margin-top:.2rem" data-act="add-item" data-id="${d.id}">＋ 新增行程</button>`;
  if(anim){const a=$('#tab-'+d.id);a.classList.add('bounce');a.scrollIntoView?.({inline:'center',block:'nearest',behavior:reduced()?'auto':'smooth'})}
}

const TRANSIT_SKIP=['步行','其他',''];
const DIR_MODE={'步行':'walking','計程車':'driving','租車':'driving'};
const dirUrl=(o,dst,m)=>'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(o)+'&destination='+encodeURIComponent(dst)+'&travelmode='+(DIR_MODE[m]||'transit');
function renderTransit(){
  const days=sortedDays(),box=$('#transit');
  const head=secHead('transit','交通方式','點選天數，依序看當天的地點；兩個地點之間會自動產生交通區段，可以直接打字備註');
  if(!days.length){box.innerHTML=head+'<p class="empty">還沒有行程。先到「每日行程」新增一天和地點。</p>';return}
  if(!days.some(d=>d.id===ui.tday))ui.tday=days[0].id;
  const oldTabs=$('#transit .daytabs'),sl=oldTabs?oldTabs.scrollLeft:0;
  const idx=days.findIndex(d=>d.id===ui.tday),d=days[idx],its=sortedItems(d);
  const tabs=days.map((x,i)=>`<button type="button" class="dt" role="tab" aria-selected="${x.id===ui.tday}" data-act="tday" data-id="${x.id}"><small>Day ${i+1}</small><b>${md(x.date)}</b><small>${wk(x.date)}</small></button>`).join('');
  const chain=its.length?its.map(x=>esc(x.title)).join(' <b>➔</b> '):'';
  const legs=its.slice(1).map((b,i)=>{
    const a=its[i];
    return `<li class="leg"><p class="leg-route">${esc(a.title)} <b>➔</b> ${esc(b.title)}</p>
    <div class="leg-top"><label class="leg-mode"><span>交通方式</span><select class="leg-tr" data-day="${d.id}" data-id="${b.id}" aria-label="${esc(a.title)}到${esc(b.title)}的交通方式"><option value="">未設定</option>${TRS.map(o=>`<option${o===b.tr?' selected':''}>${esc(o)}</option>`).join('')}</select></label></div>
    <label class="leg-lbl"><span>怎麼搭乘／注意事項</span><textarea class="leg-ta" rows="2" data-day="${d.id}" data-id="${b.id}" placeholder="例如：JR 山手線往新宿，搭 3 站；月台 2 號" aria-label="${esc(a.title)}到${esc(b.title)}的搭乘備註">${esc(b.trNote||'')}</textarea></label>
    <div class="leg-acts"><a class="btn sm maplink" href="${esc(dirUrl(a.addr||a.title,b.addr||b.title,b.tr))}" target="_blank" rel="noopener">查看路線</a><button type="button" class="btn sm" data-act="goto-item" data-day="${d.id}" data-id="${b.id}">查看行程</button></div></li>`;
  }).join('');
  box.innerHTML=head+`<div class="daytabs" role="tablist" aria-label="選擇天數">${tabs}</div>
  <div class="card group"><h3>Day ${idx+1} · ${md(d.date)}（${wk(d.date)}）${esc(d.title||'')}</h3>${chain?`<p class="leg-chain">${chain}</p>`:''}${legs?`<ul class="legs">${legs}</ul>`:`<p class="nothing" style="padding:.6rem 0 .4rem">${its.length?'這天只有一個地點，不需要交通區段。':'這天還沒有行程地點。'}</p>`}</div>`;
  const nt=$('#transit .daytabs');nt.scrollLeft=sl;
}

function phStrip(listId,i){

function hydratePhotos(root){
  $$('img[data-ph]',root||document).forEach(img=>{
    const id=img.dataset.ph;
    if(phCache.has(id)){img.src=phCache.get(id);return}
    if(phLoading.has(id))return;
    phLoading.add(id);
    PH.get(id).then(d=>{
      phLoading.delete(id);
      if(!d)return;
      phCache.set(id,d);
      $$(`img[data-ph="${id}"]`).forEach(x=>{x.src=d});
    }).catch(()=>{phLoading.delete(id)});
  });
}
function loadImg(file){
  return new Promise((res,rej)=>{
    const u=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{URL.revokeObjectURL(u);res(im)};
    im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('bad'))};
    im.src=u;
  });
}
async function compressImg(file){
  const im=await loadImg(file);
  let max=1280,q=.72;
  for(let k=0;k<6;k++){
    const r=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));
    const c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(im.naturalWidth*r));c.height=Math.max(1,Math.round(im.naturalHeight*r));
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    const out=c.toDataURL('image/jpeg',q);
    if(out.length<700000)return out;
    max*=.8;q=Math.max(.5,q-.05);
  }
  throw new Error('too big');
}
let phTarget=null;
async function uploadPhotos(files,t){
  const L=LISTS[t.list];
  if(!files.length||!find(S[L.key],t.id))return;
  toast('照片處理中…');
  const added=[];let fail=0,denied=false;
  let big=0;
  for(const f of files){
    const isImg=/^image\//.test(f.type)||/\.(jpe?g|png|webp|gif|bmp)$/i.test(f.name);
    try{
      let d=null,file=false;
      if(isImg){try{d=await compressImg(f)}catch(e){d=null}}
      if(!d){
        if(f.size>MAXF){big++;fail++;continue}
        d=await readFile(f);file=true;
      }
      const pid=uid()+uid();
      await PH.set(pid,d);
      if(!file)phCache.set(pid,d);
      added.push(file?{id:pid,name:f.name,file:true,size:f.size}:{id:pid,name:f.name});
    }catch(e){fail++;if(/perm|denied/i.test((e&&e.code)||''))denied=true}
  }
  if(added.length)mutate(()=>{const x=find(S[L.key],t.id);if(x)(x.photos=x.photos||[]).push(...added)});
  toast(added.length?`已加入 ${added.length} 個項目${fail?`，${fail} 個失敗`:''}`:(denied?'沒有上傳權限，請確認 Firestore 規則已加入 photos':(big?'檔案太大，非圖片檔上限約 650 KB':'上傳失敗，請再試一次')));
}

    case 'add-item':addItem(id);break;

    case 'add-flight':C.flight.add();break;
    case 'edit-flight':C.flight.edit(id);break;
    case 'add-hotel':C.hotel.add();break;
    case 'edit-hotel':C.hotel.edit(id);break;
    case 'edit-trip':editTrip();break;
    case 'edit-li':editListItem(t.dataset.list,id);break;
    case 'del-li':{const L=LISTS[t.dataset.list],x=find(S[L.key],id);if(x)mutate(()=>S[L.key].splice(S[L.key].indexOf(x),1),'已刪除項目',true);break}
    case 'dismiss':S.sample=false;save();renderHero();break;
    case 'ph-add':if(!ui.unlocked){askPw();break}phTarget={list:t.dataset.list,id};$('#phInput').click();break;
    case 'ph-view':viewPhoto(t.dataset.list,id,t.dataset.pid);break;
    case 'backup':backup();break;
    case 'login':askPw();break;
    case 'logout':logout();break;
    case 'tday':ui.tday=id;renderTransit();break;
    case 'edit-leg':{const d=find(S.days,t.dataset.day),x=d&&find(d.items,id);if(!x)break;openForm({title:'編輯交通方式',fields:[{key:'tr',label:'交通方式',type:'select',options:TRS},{key:'trNote',label:'搭乘方式備註',type:'textarea',ph:'例如：JR 山手線往新宿，搭 3 站；月台 2 號'}],values:x,onSave:v=>mutate(()=>Object.assign(x,v))});break}
    case 'goto-item':{ui.day=t.dataset.day;renderDays(true);document.getElementById('days').scrollIntoView({behavior:reduced()?'auto':'smooth',block:'start'});setTimeout(()=>{const el=document.getElementById('it-'+id),c=el&&el.querySelector('.tl-c');if(c){el.scrollIntoView({block:'center',behavior:reduced()?'auto':'smooth'});c.style.animation='flash 1.6s';setTimeout(()=>{c.style.animation=''},1800)}},reduced()?0:450);break}
    case 'copy':copyText(t.dataset.text).then(ok=>toast(ok?'已複製':'複製失敗，請長按文字手動複製'));break;
  }
});
document.addEventListener('change',e=>{
  const c=e.target.closest('input[data-list]');if(!c)return;
  if(!ui.unlocked){c.checked=!c.checked;return}
  const L=LISTS[c.dataset.list],x=find(S[L.key],c.dataset.id);if(!x)return;
  x.done=c.checked;save();renderList(c.dataset.list);
  const b=$(`[data-box="${x.id}"]`),inp=$(`input[data-id="${x.id}"]`);
  if(b&&x.done)b.classList.add('boing');
  inp&&inp.focus({preventScroll:true});
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('form[data-add]');if(!f)return;
  e.preventDefault();
  if(!ui.unlocked)return;
  const id=f.dataset.add,L=LISTS[id],text=f.elements.text.value.trim();
  if(!text){f.elements.text.focus();return}
  const o={id:uid(),text,done:false};
  if(L.cat){o.cat=(f.elements.cat.value.trim()||'其他');ui.lastCat=o.cat}
  S[L.key].push(o);save();renderList(id);$(`#${id} input[name="text"]`).focus({preventScroll:true});
});
document.addEventListener('change',e=>{
  const f=e.target.closest('textarea.leg-ta,select.leg-tr');if(!f)return;
  const d=find(S.days,f.dataset.day),x=d&&find(d.items,f.dataset.id);if(!x)return;
  if(f.tagName==='SELECT'){x.tr=f.value;save();renderTransit();renderDays(false);return}
  x.trNote=f.value.trim();save();renderDays(false);
});
function readFile(f){
  return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error('read'));r.readAsDataURL(f)});
}
function viewFile(listId,itemId,p){
  const L=LISTS[listId];
  const sz=p.size?(p.size>=1048576?(p.size/1048576).toFixed(1)+' MB':Math.max(1,Math.round(p.size/1024))+' KB'):'';
  openSheet(`<h3 id="sheet-t">${esc(p.name||'檔案')}</h3>${sz?`<p class="mut">${esc(sz)}</p>`:''}<p class="msg" id="flmsg" role="status"></p><div class="sheet-btns">${ui.editing&&ui.unlocked?'<button type="button" class="btn danger" data-sheet="rm">刪除檔案</button>':''}<span class="sp"></span><button type="button" class="btn" data-sheet="close">關閉</button><button type="button" class="btn primary" data-sheet="dl">下載</button></div>`,{
    dl:async()=>{
      const m=$('#flmsg');if(m)m.textContent='下載中…';
      try{
        const d=await PH.get(p.id);if(!d)throw 0;
        const a=document.createElement('a');a.href=d;a.download=p.name||'file';document.body.appendChild(a);a.click();a.remove();
        if(m)m.textContent='';
      }catch(e){if(m)m.textContent='下載失敗，請稍後再試。'}
    },
    rm:()=>{closeSheet();mutate(()=>{const y=find(S[L.key],itemId);if(y)y.photos=(y.photos||[]).filter(q=>q.id!==p.id)},'已刪除檔案',true)}
  });
}
/* 拖曳／貼上上傳 */
const hasFiles=e=>!!(e.dataTransfer&&[...(e.dataTransfer.types||[])].includes('Files'));
const dropLi=e=>(e.target&&e.target.closest)?e.target.closest('#todo li[data-item]'):null;
const clearDrop=()=>$$('li.drop').forEach(x=>x.classList.remove('drop'));
document.addEventListener('dragover',e=>{
  if(!hasFiles(e))return;
  e.preventDefault();
  const li=dropLi(e);clearDrop();
  if(li){li.classList.add('drop');e.dataTransfer.dropEffect='copy'}else e.dataTransfer.dropEffect='none';
});
document.addEventListener('dragleave',e=>{if(!e.relatedTarget)clearDrop()});
document.addEventListener('drop',e=>{
  if(!hasFiles(e))return;
  e.preventDefault();clearDrop();
  const li=dropLi(e),files=[...e.dataTransfer.files];
  if(!li||!files.length)return;
  if(!ui.unlocked){askPw();return}
  uploadPhotos(files,{list:'todo',id:li.dataset.item});
});
document.addEventListener('paste',e=>{
  const files=[...((e.clipboardData&&e.clipboardData.files)||[])];
  if(!files.length||!$('#scrim').hidden)return;
  e.preventDefault();
  if(!ui.unlocked){askPw();return}
  if(!phSel||!find(S.todos,phSel)){toast('先點一下要加檔案的待辦項目，再貼上');return}
  uploadPhotos(files,{list:'todo',id:phSel});
});
document.addEventListener('click',e=>{
  const li=e.target.closest&&e.target.closest('#todo li[data-item]');
  if(!li||phSel===li.dataset.item)return;
  phSel=li.dataset.item;
  $$('#todo li.sel').forEach(x=>x.classList.remove('sel'));li.classList.add('sel');
});
$('#phInput').addEventListener('change',e=>{
  const files=[...e.target.files],t=phTarget;e.target.value='';phTarget=null;
  if(t&&files.length)uploadPhotos(files,t);
});
$('#editBtn').addEventListener('click',()=>{
  if(ui.editing){setEditing(false);return}
  if(ui.unlocked)setEditing(true);else askPw(()=>setEditing(true));
});

/* 選單：移到上方/下方、隱藏、可拖曳的圓形按鈕 */
const NK='tabi-techo-nav';
const navPref={pos:'top',hide:false,fx:null,fy:.4};
try{Object.assign(navPref,JSON.parse(localStorage.getItem(NK)||'{}'))}catch(e){}
const NAVS={flights:'航班',days:'行程',transit:'交通',todo:'待辦',hotels:'住宿',prep:'出發前',pack:'行李'};
const NAV_DEF=Object.keys(NAVS);
navPref.order=(Array.isArray(navPref.order)?navPref.order:[]).filter(k=>NAVS[k]);
NAV_DEF.forEach(k=>{if(!navPref.order.includes(k))navPref.order.push(k)});
navPref.hidden=(Array.isArray(navPref.hidden)?navPref.hidden:[]).filter(k=>NAVS[k]);
function renderNav(){
  $('#nav').innerHTML='<a href="#top" data-nav="top">首頁</a>'+navPref.order.filter(k=>!navPref.hidden.includes(k)).map(k=>`<a href="#${k}" data-nav="${k}">${NAVS[k]}</a>`).join('');
}
function applyOrder(){const main=$('main'),foot=$('#foot');navPref.order.forEach(k=>{const el=document.getElementById(k);if(el){main.insertBefore(el,foot);el.hidden=navPref.hidden.includes(k)}})}
function refreshNav(){renderNav();applyOrder();applyNav();spyId='';spy()}
function openNavMenu(){
  const n=navPref.order.length;
  const rows=navPref.order.map((k,i)=>{const h=navPref.hidden.includes(k);return `<li class="orgrow"><span class="txt">${NAVS[k]}</span><button type="button" class="btn sm ${h?'':'ok'}" data-sheet="tg" data-k="${k}">${h?'已隱藏':'顯示中'}</button><span class="eb"><button type="button" class="mini" data-sheet="up" data-k="${k}" aria-label="上移" ${i===0?'disabled':''}>↑</button><button type="button" class="mini" data-sheet="dn" data-k="${k}" aria-label="下移" ${i===n-1?'disabled':''}>↓</button></span></li>`}).join('');
  const redo=()=>{refreshNav();openNavMenu()};
  const move=(b,d)=>{const k=b.dataset.k,i=navPref.order.indexOf(k),j=i+d;if(j<0||j>=n)return;navPref.order.splice(i,1);navPref.order.splice(j,0,k);redo()};
  openSheet(`<h3 id="sheet-t">選單設定</h3><div style="display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:.8rem"><button type="button" class="btn sm" data-sheet="pos">選單移到${navPref.pos==='bottom'?'上方':'下方'}</button><button type="button" class="btn sm" data-sheet="hide">隱藏整個選單</button></div><p class="mut">用 ↑↓ 調整順序（頁面內容也會跟著換位置），按「顯示中」會隱藏該項目，頁面內容也會一起隱藏（再按一次就會顯示）。設定只存在這台裝置。</p><ul class="rows orglist">${rows}</ul><div class="sheet-btns" style="margin-top:.8rem"><button type="button" class="btn" data-sheet="reset">還原預設</button><span class="sp"></span><button type="button" class="btn primary" data-sheet="close">完成</button></div>`,{
    pos:()=>{navPref.pos=navPref.pos==='bottom'?'top':'bottom';redo()},
    hide:()=>{navPref.hide=true;closeSheet();refreshNav();toast('選單已隱藏，點圓形按鈕可以叫回來，按住可以拖曳移動')},
    tg:b=>{const k=b.dataset.k,i=navPref.hidden.indexOf(k);if(i>=0)navPref.hidden.splice(i,1);else navPref.hidden.push(k);redo()},
    up:b=>move(b,-1),dn:b=>move(b,1),
    reset:()=>{navPref.order=NAV_DEF.slice();navPref.hidden=[];redo()}
  });
}
renderNav();applyOrder();
const nb=$('#navbar'),fab=$('#fab');
function applyNav(){
  nb.classList.toggle('bottom',navPref.pos==='bottom');
  nb.classList.toggle('hide',navPref.hide);
  fab.classList.toggle('on',navPref.hide);
  document.body.classList.toggle('navb',navPref.pos==='bottom'&&!navPref.hide);
  const y=Math.min(Math.max(8,Math.round(navPref.fy*innerHeight)),innerHeight-56);
  fab.style.top=y+'px';
  if(navPref.fx==null){fab.style.right='12px';fab.style.left='auto'}
  else{fab.style.left=Math.min(Math.max(8,Math.round(navPref.fx*innerWidth)),innerWidth-56)+'px';fab.style.right='auto'}
  try{localStorage.setItem(NK,JSON.stringify(navPref))}catch(e){}
}
$('#navMenu').addEventListener('click',openNavMenu);
let drag=null;
fab.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,moved:false,ox:fab.offsetLeft,oy:fab.offsetTop};fab.setPointerCapture(e.pointerId)});
fab.addEventListener('pointermove',e=>{
  if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!drag.moved&&Math.hypot(dx,dy)<6)return;drag.moved=true;
  fab.style.left=Math.min(innerWidth-56,Math.max(8,drag.ox+dx))+'px';fab.style.right='auto';
  fab.style.top=Math.min(innerHeight-56,Math.max(8,drag.oy+dy))+'px';
});
fab.addEventListener('pointerup',()=>{
  if(!drag)return;const m=drag.moved;drag=null;
  if(m){navPref.fx=fab.offsetLeft/innerWidth;navPref.fy=fab.offsetTop/innerHeight}else navPref.hide=false;
  applyNav();
});
fab.addEventListener('pointercancel',()=>{drag=null});
fab.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();navPref.hide=false;applyNav()}});
applyNav();
const secIds=()=>['top',...navPref.order.filter(k=>!navPref.hidden.includes(k))];let spyId='',raf=0;
function spy(){
  let cur='top';for(const id of secIds()){if(document.getElementById(id).getBoundingClientRect().top<=130)cur=id}
  if(cur===spyId)return;spyId=cur;
  $$('#nav a').forEach(a=>{const on=a.dataset.nav===cur;a.classList.toggle('on',on);on?a.setAttribute('aria-current','true'):a.removeAttribute('aria-current')});
  const a=$(`#nav a[data-nav="${cur}"]`),n=$('#nav');if(a)n.scrollTo({left:a.offsetLeft-n.clientWidth/2+a.offsetWidth/2,behavior:'auto'});
}
addEventListener('scroll',()=>{if(!raf)raf=requestAnimationFrame(()=>{raf=0;spy()})},{passive:true});

renderAll();spy();
setInterval(tick,1000);
initSync();
})();
</script>

<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>旅行手帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<style>
:root{
  --paper:#FFFCF6; --white:#FFFFFF; --sand:#F7EEDF;
  --ink:#3E3A39; --ink-soft:#7A7470;
  --coral:#FAC9BF; --yellow:#FBE7A8; --blue:#C7E6F2; --green:#D4ECC3;
  --pink:#F9D4E1; --lavender:#E0D9F4; --peach:#FFD9BD; --mint:#C9EEE0;
  --r:26px; --r2:20px; --r3:16px;
  --bounce:cubic-bezier(.34,1.56,.64,1);
  --font:'Huninn','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--paper);scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font:400 16px/1.65 var(--font);font-synthesis:none;-webkit-text-size-adjust:100%;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--paper)}
body.lock{overflow:hidden}
h1,h2,h3,h4,p,ol,ul{margin:0;padding:0}
ol,ul{list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px dashed var(--ink);outline-offset:3px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mut{color:var(--ink-soft)}
body:not(.editing) .edit-only{display:none!important}
section[hidden]{display:none!important}

.ill{display:block}
.ill *{fill:none;stroke:var(--ink);stroke-width:var(--sw,2.4);stroke-linejoin:round;stroke-linecap:round}
.ill .fc{fill:var(--coral)}.ill .fy{fill:var(--yellow)}.ill .fb{fill:var(--blue)}.ill .fg{fill:var(--green)}
.ill .fw{fill:var(--white)}.ill .fi{fill:var(--ink)}.ill .fn{fill:none}.ill .ns{stroke:none}
.ill .fs{fill:var(--sand)}

.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--paper);border-bottom:2px solid var(--ink)}
.nav-in{display:flex;align-items:center;gap:.5rem;padding-top:.55rem;padding-bottom:.55rem}
.mini.nb{width:30px;height:30px;font-size:.9rem;flex:none;margin-bottom:3px}
.mini:disabled{opacity:.35;cursor:default}

#nav{display:flex;gap:.4rem;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none;padding:2px 2px 5px}
#nav::-webkit-scrollbar{display:none}
#nav a{flex:none;text-decoration:none;border:2px solid var(--ink);border-radius:999px;padding:.1rem .85rem;background:var(--white);font-size:.95rem;line-height:1.5;box-shadow:0 2px 0 var(--ink)}
#nav a.on{background:var(--yellow)}
.btn{border:2px solid var(--ink);border-radius:999px;background:var(--white);padding:.22rem 1rem;line-height:1.5;box-shadow:0 2px 0 var(--ink);transition:transform .15s var(--bounce),box-shadow .15s}
.btn:active{transform:translateY(2px);box-shadow:0 0 0 var(--ink)}
.btn.primary{background:var(--coral)}
.btn.ok{background:var(--green)}
.btn.danger{background:var(--white)}
.btn.sm{padding:.08rem .8rem;font-size:.9rem}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;min-height:2rem;padding:0 .6rem}
.icon-btn svg{display:block;width:18px;height:18px}
.icon-btn.off{background:var(--sand);color:var(--ink-soft)}
#editBtn{flex:none;margin-bottom:3px}
.sync{flex:none;width:16px;height:16px;border:2px solid var(--ink);border-radius:50%;background:var(--sand);margin-bottom:3px}
.sync[data-s="live"]{background:var(--green)}
.sync[data-s="wait"]{background:var(--yellow)}
.sync[data-s="err"],.sync[data-s="ro"]{background:var(--coral)}
.hint{margin-top:1rem;border:2px dashed var(--ink);border-radius:var(--r2);padding:.5rem .9rem;background:var(--yellow);font-size:.9rem}

/* 桌機版：章節選單由左而右、排滿往下換行 */
@media (min-width:768px){
  #nav{flex-wrap:wrap;overflow-x:visible;overflow-y:visible;padding:2px 0 6px;gap:.4rem .4rem}
}

main{padding-top:1.2rem;padding-bottom:calc(3rem + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:2.2rem}
.sec{scroll-margin-top:84px;display:flex;flex-direction:column;gap:1rem}
.sec-h{display:flex;align-items:center;gap:.7rem;font-size:1.4rem;line-height:1.3;font-weight:400}
.sec-h .ico{width:48px;height:48px;flex:none;border:2px solid var(--ink);border-radius:var(--r3);display:grid;place-items:center}
.sec-h .ico svg{width:34px;height:34px;--sw:2.2}
.sec-sub{font-size:.9rem;color:var(--ink-soft);margin-top:-.5rem}
.card{background:var(--white);border:2px solid var(--ink);border-radius:var(--r)}

.hero{overflow:hidden;background:var(--paper)}
.hero-ill{width:100%;height:auto;border-bottom:2px solid var(--ink)}
.hero-body{padding:1.1rem 1.1rem 1.3rem;display:flex;flex-direction:column;gap:.7rem}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{border:2px solid var(--ink);border-radius:999px;padding:0 .7rem;font-size:.85rem;background:var(--blue);line-height:1.6}
.chip.y{background:var(--yellow)}
.hero h1{font-size:clamp(1.7rem,7.4vw,2.5rem);line-height:1.25;font-weight:400;text-wrap:balance}
.tagline{color:var(--ink-soft)}
.cd-label{font-size:.85rem;color:var(--ink-soft)}
.clk-h{display:flex;align-items:center;justify-content:space-between;gap:.5rem}
.clk-h small{font-size:.85rem;color:var(--ink-soft)}
.clk{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.clk.one{grid-template-columns:1fr}
.clk-c{border:2px solid var(--ink);border-radius:var(--r3);padding:.4rem .7rem .35rem;min-width:0;background:var(--yellow)}
.clk-c.tw{background:var(--blue)}
.clk-c small{display:block;font-size:.8rem}
.clk-c b{display:block;font-weight:400;font-size:clamp(1.3rem,6.2vw,1.8rem);line-height:1.2;font-variant-numeric:tabular-nums}
.clk-c em{display:block;font-style:normal;font-size:.78rem;color:var(--ink-soft)}
.clk-diff{grid-column:1/-1;font-size:.8rem;color:var(--ink-soft);margin-top:-.1rem}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem}
.cd-t{border:2px solid var(--ink);border-radius:var(--r3);text-align:center;padding:.4rem .2rem .3rem;min-width:0}
.cd-t b{display:block;font-weight:400;font-size:clamp(1.5rem,7.5vw,2.2rem);line-height:1.15;font-variant-numeric:tabular-nums}
.cd-t span{font-size:.8rem}
.cd-t:nth-child(1){background:var(--coral)}.cd-t:nth-child(2){background:var(--yellow)}
.cd-t:nth-child(3){background:var(--blue)}.cd-t:nth-child(4){background:var(--green)}
.cd-msg{grid-column:1/-1;border:2px solid var(--ink);border-radius:var(--r3);background:var(--mint);padding:.7rem 1rem;text-align:center;font-size:1.15rem}
.banner{display:flex;align-items:flex-start;gap:.6rem;border:2px solid var(--ink);border-radius:var(--r2);background:var(--yellow);padding:.5rem .5rem .5rem .9rem;font-size:.9rem}
.banner p{flex:1;min-width:0}

.flight{overflow:hidden;position:relative}
.fl-top{display:flex;align-items:center;gap:.6rem;padding:.8rem 1rem .2rem;flex-wrap:wrap}
.dir{border:2px solid var(--ink);border-radius:999px;padding:0 .8rem;font-size:.9rem;background:var(--coral);line-height:1.6}
.dir.back{background:var(--blue)}
.fl-no{flex:1;min-width:0}
.fl-route{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:.4rem;padding:.4rem 1rem .9rem}
.ap{display:flex;flex-direction:column;min-width:0}
.ap b{font-weight:400;font-size:clamp(1.9rem,9vw,2.6rem);line-height:1.1;letter-spacing:.04em}
.ap span{font-size:.85rem;color:var(--ink-soft)}
.ap.r{text-align:right}
.fl-arc{width:100%;height:auto;max-width:150px;margin:0 auto}
.perf{border-top:2px dashed var(--ink);position:relative}
.perf::before,.perf::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border:2px solid var(--ink);border-radius:50%;background:var(--paper)}
.perf::before{left:-12px}.perf::after{right:-12px}
.fl-meta{display:grid;grid-template-columns:1fr 1fr;gap:.6rem 1rem;padding:.9rem 1rem 1rem}
.fl-meta small,.kv small{display:block;font-size:.8rem;color:var(--ink-soft);line-height:1.4}
.fl-meta b,.kv b{font-weight:400}
.fl-note{grid-column:1/-1;font-size:.9rem;white-space:pre-line}
.eb{display:inline-flex;gap:.3rem;flex:none}
.mini{width:32px;height:32px;border:2px solid var(--ink);border-radius:50%;background:var(--white);padding:0;line-height:1;font-size:.9rem;display:grid;place-items:center}
.mini.x{background:var(--coral)}
.mini.icon-btn{padding:0;width:32px;height:32px}
.fl-top .eb{margin-left:auto}
.add{align-self:flex-start;border:2px dashed var(--ink);border-radius:999px;background:var(--paper);padding:.22rem 1rem;line-height:1.5}

.daytabs{display:flex;gap:.5rem;overflow-x:auto;padding:4px 3px 8px;margin:0 -3px;scrollbar-width:none;scroll-snap-type:x proximity}
.daytabs::-webkit-scrollbar{display:none}
.dt{flex:none;scroll-snap-align:center;min-width:4.6rem;border:2px solid var(--ink);border-radius:var(--r2);background:var(--white);padding:.25rem .5rem .3rem;text-align:center;line-height:1.35;box-shadow:0 3px 0 var(--ink)}
.dt small{display:block;font-size:.75rem;color:var(--ink-soft)}
.dt b{display:block;font-weight:400;font-size:1.15rem}
.dt[aria-selected="true"]{background:var(--yellow)}
.dt[aria-selected="true"] small{color:var(--ink)}
.dt.bounce{animation:boing .55s var(--bounce)}
.dt.addday{display:grid;place-content:center;background:var(--paper);border-style:dashed;font-size:1.4rem}

.day-head{display:flex;align-items:center;gap:.8rem;padding:.7rem .9rem;background:var(--blue)}
.day-ill{width:76px;flex:none;background:var(--paper);border:2px solid var(--ink);border-radius:var(--r3);padding:4px}
.day-ill svg{width:100%;height:auto;--sw:2.2}
.day-head .t{flex:1;min-width:0}
.day-head small{font-size:.85rem}
.day-head h3{font-size:1.25rem;font-weight:400;line-height:1.35;overflow-wrap:anywhere}
.tl{margin-top:1.1rem}
.tl-i{display:grid;grid-template-columns:3.2rem 22px minmax(0,1fr);column-gap:.45rem;padding-bottom:1rem}
.tl-t{text-align:right;font-size:.95rem;line-height:1.9;font-variant-numeric:tabular-nums;padding-top:.45rem}
.rail{position:relative}
.rail::before{content:"";position:absolute;left:50%;top:0;bottom:-1rem;border-left:2px solid var(--ink);transform:translateX(-50%)}
.tl-i:last-child .rail::before{bottom:auto;height:32px}
.dot{position:absolute;left:50%;top:14px;width:18px;height:18px;margin-left:-9px;border:2px solid var(--ink);border-radius:50%;background:var(--white)}
.dot.must{background:var(--coral);width:22px;height:22px;margin-left:-11px;top:12px}
.tl-c{border:2px solid var(--ink);border-radius:var(--r3);background:var(--white);padding:.55rem .8rem .65rem;min-width:0}
.tl-c.must{background:var(--yellow)}
.tl-tags{display:flex;gap:.35rem;flex-wrap:wrap;align-items:center;margin-bottom:.15rem}
.tl-c h4{font-weight:400;font-size:1.05rem;line-height:1.45;overflow-wrap:anywhere}
.tl-c p{font-size:.88rem;color:var(--ink-soft);white-space:pre-line;overflow-wrap:anywhere}
.tl-c.must p{color:var(--ink)}
.tl-c .eb{margin-top:.4rem}
.tl-c .item-actions{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.5rem}
.tag{border:2px solid var(--ink);border-radius:999px;padding:0 .6rem;font-size:.78rem;line-height:1.6;background:var(--sand)}
.bg-c{background:var(--coral)}.bg-y{background:var(--yellow)}.bg-b{background:var(--blue)}.bg-g{background:var(--green)}.bg-w{background:var(--white)}
.mustb{display:inline-flex;align-items:center;gap:.2rem;border:2px solid var(--ink);border-radius:999px;background:var(--coral);padding:0 .6rem 0 .4rem;font-size:.78rem;line-height:1.6}
.mustb svg{width:14px;height:14px;--sw:2}
.empty{border:2px dashed var(--ink);border-radius:var(--r);padding:1.2rem;text-align:center;color:var(--ink-soft)}
.pop-in{animation:pop .55s var(--bounce) both;animation-delay:calc(var(--i,0)*70ms)}
#daypanel.swap .day-head{animation:pop .5s var(--bounce) both}

.prog{display:flex;align-items:center;gap:.7rem;font-size:.9rem}
.prog .track{flex:1;height:16px;border:2px solid var(--ink);border-radius:999px;background:var(--white);overflow:hidden}
.prog .bar{height:100%;background:var(--green);border-right:2px solid var(--ink);transition:width .5s var(--bounce)}
.prog .bar[style*="width:0%"]{border-right:0}
.prog span{flex:none;font-variant-numeric:tabular-nums}
.group{padding:.8rem 1rem .5rem}
.group+.group{margin-top:-.4rem}
.group h3{font-weight:400;font-size:1rem;display:inline-block;border:2px solid var(--ink);border-radius:999px;padding:0 .8rem;background:var(--blue);line-height:1.6;margin-bottom:.3rem}
.rows li{display:flex;align-items:center;gap:.5rem;padding:.35rem 0;border-top:2px dotted var(--ink);flex-wrap:wrap}
.rows li:first-child{border-top:0}
.chk{display:flex;align-items:center;gap:.7rem;flex:1;min-width:0;cursor:pointer;position:relative}
.chk input{position:absolute;opacity:0;width:28px;height:28px;margin:0}
.box{flex:none;width:26px;height:26px;border:2px solid var(--ink);border-radius:10px;background:var(--white);display:grid;place-items:center}
.box svg{width:16px;height:16px;opacity:0;--sw:3}
.chk input:checked~.box{background:var(--green)}
.chk input:checked~.box svg{opacity:1}
.chk input:focus-visible~.box{outline:2px dashed var(--ink);outline-offset:3px}
.chk .txt{min-width:0;overflow-wrap:anywhere}
li.done .txt{color:var(--ink-soft);text-decoration:line-through;text-decoration-thickness:2px}
.addrow{display:flex;gap:.5rem;flex-wrap:wrap;padding:.6rem 1rem 1rem;border-top:2px dashed var(--ink)}
.addrow input{flex:1 1 9rem;min-width:0;border:2px solid var(--ink);border-radius:999px;background:var(--paper);padding:.2rem .9rem}
.addrow input[name="cat"]{flex:0 1 7rem}
.addrow select{flex:0 1 8.5rem;min-width:0;border:2px solid var(--ink);border-radius:999px;background:var(--paper);padding:.2rem .6rem}
.mk{flex:none;border:2px solid var(--ink);border-radius:999px;background:var(--pink);padding:0 .6rem;font-size:.8rem;line-height:1.6;margin-left:.2rem;white-space:nowrap}
.listcard{overflow:hidden}
.nothing{padding:.9rem 1rem 0;color:var(--ink-soft);font-size:.9rem}
.ph-strip{flex:0 0 100%;display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;padding:.1rem 0 .3rem 2.4rem}
body:not(.editing) .ph-strip:not(.has){display:none}
.ph-th{width:64px;height:64px;padding:0;border:2px solid var(--ink);border-radius:14px;overflow:hidden;background:var(--sand);flex:none}
.ph-th img{display:block;width:100%;height:100%;object-fit:cover}
img[data-ph]:not([src]){visibility:hidden}
.ph-add{border:2px dashed var(--ink);border-radius:999px;background:var(--paper);padding:0 .8rem;font-size:.85rem;line-height:1.7}
.ph-big{display:block;width:100%;max-height:60vh;object-fit:contain;border:2px solid var(--ink);border-radius:var(--r3);background:var(--white);min-height:4rem}
.ph-file{max-width:100%;border:2px solid var(--ink);border-radius:999px;background:var(--blue);padding:0 .8rem;font-size:.85rem;line-height:1.7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rows li.sel{background:var(--sand);border-radius:12px}
.rows li.drop{background:var(--yellow);outline:2px dashed var(--ink);outline-offset:-3px;border-radius:12px}
.todo-tabs .dt{min-width:auto}
.todo-tabs .dt small{font-size:.7rem}
.todo-tabs .dt b{font-size:.95rem}

.hotel{overflow:hidden}
.hotel-h{display:flex;align-items:center;gap:.7rem;background:var(--peach);border-bottom:2px solid var(--ink);padding:.7rem 1rem}
.hotel-h h3{font-weight:400;font-size:1.15rem;line-height:1.4;flex:1;min-width:0;overflow-wrap:anywhere}
.nights{flex:none;border:2px solid var(--ink);border-radius:999px;background:var(--white);padding:0 .7rem;font-size:.85rem;line-height:1.6}
.hotel-b{padding:.9rem 1rem 1rem;display:flex;flex-direction:column;gap:.7rem}
.kvs{display:grid;grid-template-columns:1fr 1fr;gap:.6rem 1rem}
.kv{min-width:0}
.kv.w{grid-column:1/-1}
.kv b{overflow-wrap:anywhere}
.kv .acts{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.3rem}
.kv .acts .btn{padding:0 .8rem;font-size:.85rem;box-shadow:0 2px 0 var(--ink);text-decoration:none;display:inline-block}
.note{font-size:.9rem;white-space:pre-line;color:var(--ink-soft)}

footer{display:flex;flex-direction:column;align-items:center;gap:.6rem;text-align:center;padding-top:.5rem}
.cat{width:110px;height:auto}
footer p{font-size:.88rem;color:var(--ink-soft);max-width:30em}
.foot-btns{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center}
.maplink{display:inline-block;text-decoration:none;box-shadow:0 2px 0 var(--ink)}

.legs{display:flex;flex-direction:column;gap:.6rem;margin-top:.4rem}
.legs li.leg{display:block;padding:.7rem .9rem;border:2px solid var(--ink);border-radius:var(--r3);background:var(--white)}
.leg-h{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;font-size:.95rem;line-height:1.4;margin-bottom:.4rem}
.leg-no{flex:none;display:inline-flex;align-items:center;justify-content:center;width:1.55rem;height:1.55rem;border:2px solid var(--ink);border-radius:50%;background:var(--coral);font-size:.72rem;font-variant-numeric:tabular-nums}
.leg-from,.leg-to{font-weight:500;overflow-wrap:anywhere}
.leg-arrow{color:var(--ink-soft);font-weight:700}
.leg-mode{display:flex;align-items:center;gap:.5rem;font-size:.85rem;color:var(--ink-soft);margin-top:.2rem}
.leg-mode select{border:2px solid var(--ink);border-radius:999px;background:var(--white);padding:.05rem .6rem;color:var(--ink);min-width:0}
.leg-lbl{display:flex;flex-direction:column;gap:.15rem;margin-top:.5rem;font-size:.85rem;color:var(--ink-soft)}
.leg-ta{display:block;width:100%;min-height:3.6rem;resize:vertical;border:2px solid var(--ink);border-radius:14px;background:var(--paper);padding:.35rem .8rem;line-height:1.5;color:var(--ink)}
.leg-acts{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.5rem}
.leg-acts .maplink{margin:0}
.leg-chain{display:flex;flex-wrap:wrap;align-items:center;gap:.35rem;padding:.6rem .8rem;background:var(--sand);border:2px dashed var(--ink);border-radius:var(--r3);margin:.5rem 0 .9rem;font-size:.88rem;line-height:1.7}
.chain-chip{background:var(--white);border:2px solid var(--ink);border-radius:999px;padding:0 .65rem;line-height:1.7;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chain-arrow{color:var(--ink-soft);font-weight:700;flex:none}
#transit .group{padding-bottom:.9rem}
#transit .group h3{background:var(--lavender)}

.scrim{position:fixed;inset:0;z-index:80;background:rgba(62,58,57,.38);display:flex;align-items:center;justify-content:center;padding:16px}
.scrim[hidden]{display:none}
.sheet{width:100%;max-width:520px;max-height:86vh;max-height:86dvh;overflow-y:auto;background:var(--paper);border:2px solid var(--ink);border-radius:var(--r);padding:1.1rem 1.2rem 1.2rem;animation:sheetPop .45s var(--bounce)}
.sheet h3{font-weight:400;font-size:1.3rem;margin-bottom:.8rem}
.sheet form{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.8rem 1rem}
.fld{grid-column:1/-1;display:flex;flex-direction:column;gap:.15rem;min-width:0;max-width:100%}
.fld.half{grid-column:auto}
.fld>span{font-size:.85rem;color:var(--ink-soft)}
.fld input,.fld select,.fld textarea,.sheet textarea{display:block;width:100%;min-width:0;max-width:100%;border:2px solid var(--ink);border-radius:14px;background:var(--white);padding:.3rem .8rem;line-height:1.5;text-align:left}
.fld input[type="date"],.fld input[type="time"],.fld input[type="datetime-local"]{-webkit-appearance:none;appearance:none;min-height:2.9rem;overflow:hidden}
.fld input::-webkit-date-and-time-value{text-align:left;min-height:1.5em;margin:0}
.fld input::-webkit-datetime-edit{padding:0}
.fld select{text-overflow:ellipsis;min-height:2.9rem}
.fld textarea,.sheet textarea{resize:vertical;min-height:5.5rem}
.crow{grid-column:1/-1;display:flex;align-items:center;gap:.7rem;cursor:pointer;position:relative}

.cover-img{aspect-ratio:360/250;background:var(--sand);border-bottom:2px solid var(--ink)}

.sun-rays{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite}
.sun-core{transform-box:fill-box;transform-origin:center;animation:breathe 4s ease-in-out infinite}
.cloud{animation:drift 9s ease-in-out infinite alternate}
.cloud.b{animation-duration:12s;animation-delay:-4s}
.train{transform:translateX(150px);animation:run 20s linear infinite}
.plane{animation:bob 3.6s ease-in-out infinite}
.tree{transform-box:fill-box;transform-origin:50% 100%;animation:sway 5s ease-in-out infinite}
.snow{fill:var(--white);animation:snow linear infinite}
.paw{transform-box:fill-box;transform-origin:50% 100%;animation:wave 2.4s ease-in-out infinite}
.bobber{animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(26px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes run{from{transform:translateX(-140px)}to{transform:translateX(500px)}}
@keyframes snow{0%{transform:translate(0,-10px)}100%{transform:translate(-22px,230px)}}
@keyframes sway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
@keyframes wave{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(14deg)}}
@keyframes pop{0%{transform:translateY(16px) scale(.9);opacity:0}60%{transform:translateY(-3px) scale(1.03);opacity:1}100%{transform:none;opacity:1}}
@keyframes boing{0%{transform:scale(1)}30%{transform:scale(.86,1.12)}55%{transform:scale(1.12,.92)}80%{transform:scale(.97)}100%{transform:scale(1)}}
@keyframes sheetPop{0%{transform:scale(.8);opacity:0}60%{transform:scale(1.03);opacity:1}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  .snow{display:none}
}

function normalize(o){
  if(!o||typeof o!=='object'||!o.trip) return null;
  const arr=k=>Array.isArray(o[k])?o[k]:[];
  const fix=a=>a.map(x=>({...x,id:x.id||uid()}));
  let nav={order:DEF_ORDER.slice(),hidden:[]};
  if(o.nav&&typeof o.nav==='object'){
    const order=Array.isArray(o.nav.order)?o.nav.order.filter(id=>DEF_ORDER.includes(id)):[];
    DEF_ORDER.forEach(id=>{if(!order.includes(id))order.push(id)});
    const hidden=Array.isArray(o.nav.hidden)?o.nav.hidden.filter(id=>DEF_ORDER.includes(id)&&id!=='top'):[];
    nav={order,hidden};
  }
  return {
    sample:!!o.sample,
    cover:{mode:'scene',style:'classic',seed:1,...(o.cover||{})},
    trip:{title:'',tagline:'',depart:'',back:'',tz:'',...o.trip},
    nav,
    flights:fix(arr('flights')),
    days:arr('days').map(d=>({...d,id:d.id||uid(),items:fix(Array.isArray(d.items)?d.items:[])})),
    hotels:fix(arr('hotels')),
    todos:fix(arr('todos')).map(x=>({...x,dayId:x.dayId||''})),
    todoCats:Array.isArray(o.todoCats)?o.todoCats.slice():[...new Set(arr('todos').map(i=>i.cat||'未分類'))],
    prep:fix(arr('prep')),
    pack:fix(arr('pack'))
  };
}
function normRoot(o){

  const d=normalize(o);return d?{trips:[{id:'t1',name:(d.trip.title||'我的旅行').slice(0,10),country:'日本',data:d}]}:null;
}

let dbDoc=null,syncState='local',lastJson='',remoteJson='',deferred=null,pushT=0,firstSnap=true;
const SYNC_TXT={local:'尚未連線，目前只存在這台裝置（登入 Google 後可跨裝置同步）',wait:'同步中…',live:'已連線：所有人的修改會即時同步',ro:'這個 Google 帳號沒有編輯權限，修改不會同步',err:'同步失敗，會再自動重試'};
function setSync(s){
  syncState=s;
  const d=$('#syncDot');if(d){d.dataset.s=s;d.title='同步狀態：'+SYNC_TXT[s];d.setAttribute('aria-label','同步狀態：'+SYNC_TXT[s])}
  const t=$('#syncTxt');if(t)t.textContent=SYNC_TXT[s];
}
function push(){
  if(!dbDoc||!ui.unlocked||firstSnap)return;
  clearTimeout(pushT);
  pushT=setTimeout(async()=>{
    const json=JSON.stringify(ROOT);
    if(json===lastJson)return;
    setSync('wait');
    try{
      await dbDoc.set({json,at:Date.now()});
      lastJson=json;remoteJson=json;setSync('live');
      if(JSON.stringify(ROOT)!==json)push();
    }catch(e){
      if(/perm|denied|grant|auth/i.test((e&&e.code)||'')){
        setSync('ro');toast('沒有寫入權限，這次的修改沒有同步');
        if(remoteJson){lastJson=remoteJson;applyRemote(remoteJson,true)}
      }else{setSync('err');pushT=setTimeout(push,5000)}
    }
  },500);
}
const busy=()=>{
  if(!$('#scrim').hidden||ui.renaming)return true;
  const a=document.activeElement;
  return !!(a&&a.matches&&a.matches('main input[name="text"],main input[name="cat"],main input[name="newcat"],main textarea.leg-ta')&&a.value);
};
function applyRemote(json,force){
  if(json===JSON.stringify(ROOT)){lastJson=json;return}
  if(!force&&ui.unlocked&&JSON.stringify(ROOT)!==lastJson)return;
  if(!force&&busy()){deferred=json;setTimeout(flush,1500);return}
  let n=null;try{n=normRoot(JSON.parse(json))}catch(e){}
  if(!n)return;
  setRoot(n);lastJson=json;
  try{localStorage.setItem(KEY,JSON.stringify(ROOT))}catch(e){}
  renderAll();
}
function flush(){
  if(deferred==null)return;
  if(busy()){setTimeout(flush,1500);return}
  const j=deferred;deferred=null;applyRemote(j);
}
async function initSync(){
  if(!FB_ON){setSync('local');return}
  try{
    const B='https://www.gstatic.com/firebasejs/10.12.2/';
    const [{initializeApp},A,D]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')]);
    const app=initializeApp(FB);
    AU=A;auth=A.getAuth(app);
    A.setPersistence&&A.setPersistence(auth,A.browserLocalPersistence).catch(()=>{});
    const fdb=D.getFirestore(app);
    const ref=D.doc(fdb,'trips','main');
    PH={
      set:(id,d)=>D.setDoc(D.doc(fdb,'photos',id),{data:d,at:Date.now()}),
      get:async id=>{const s=await D.getDoc(D.doc(fdb,'photos',id));return s.exists()?s.data().data:null}
    };
    dbDoc={set:d=>D.setDoc(ref,d),onSnapshot:(ok,er)=>D.onSnapshot(ref,s=>ok({exists:s.exists(),data:()=>s.data()}),er)};
    A.onAuthStateChanged(auth,u=>{
      ui.user=u;
      const em=u&&(u.email||'').toLowerCase();
      ui.unlocked=!!u&&(!EDITORS.length||EDITORS.map(x=>x.toLowerCase()).includes(em));
      if(!ui.unlocked&&ui.editing)setEditing(false);
      renderFoot();
      if(u&&!ui.unlocked){setSync('ro')}
      else if(ui.unlocked){setSync('live');push()}
    });
    setSync('wait');
    const timer=setTimeout(()=>{if(firstSnap)setSync('local')},10000);
    dbDoc.onSnapshot(snap=>{
      clearTimeout(timer);
      const d=snap.exists?snap.data():null;
      if(d&&typeof d.json==='string'){
        remoteJson=d.json;
        if(firstSnap){firstSnap=false;applyRemote(d.json,true)}else applyRemote(d.json);
        if(syncState!=='ro'&&syncState!=='wait')setSync('live');
      }else{
        firstSnap=false;
        setSync('live');
        if(ui.unlocked)push();
      }
    },()=>{setSync('local')});
  }catch(e){setSync('local')}
}

const parseD=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||'');return m?new Date(+m[1],+m[2]-1,+m[3]):null};
const md=s=>{const d=parseD(s);return d?`${d.getMonth()+1}/${d.getDate()}`:''};
const wk=s=>{const d=parseD(s);return d?'週'+'日一二三四五六'[d.getDay()]:''};
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const nl=s=>esc(s);
const find=(arr,id)=>(arr||[]).find(x=>x.id===id);
const asUrl=a=>{const s=String(a||'').trim();if(!s||/\s/.test(s))return '';if(/^https?:\/\//i.test(s))return s;if(/^(www\.)?(maps\.app\.goo\.gl|goo\.gl\/maps|google\.[a-z.]+\/maps|maps\.google\.[a-z.]+)/i.test(s))return 'https://'+s;return ''};
const mapUrl=a=>asUrl(a)||'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(a);
const urlPlace=u=>{try{const x=new URL(u);let h=x.href;try{h=decodeURIComponent(h)}catch(e){}
  let m=h.match(/!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/);if(m)return m[1]+','+m[2];
  m=x.pathname.match(/\/(?:place|search)\/([^/@]+)/);if(m){let n=m[1].replace(/\+/g,' ');try{n=decodeURIComponent(n)}catch(e){}if(n.trim())return n.trim()}
  for(const k of ['destination','daddr','query','q']){const v=x.searchParams.get(k);if(v)return v}
  m=x.pathname.match(/@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/);if(m)return m[1]+','+m[2];
}catch(e){}return ''};
const placeText=x=>{const raw=String(x.addr||'').trim();if(!raw)return x.title||'';const u=asUrl(raw);return u?(urlPlace(u)||u):raw};

    const px=r(250,320);o+=`<g class="tree"><path class="fi" d="M${f(px)} 214Q${f(px-8)} 170 ${f(px+4)} 130"/><path class="fg" d="M${f(px+4)} 130q-30-6-40 14q22-14 40-4zM${f(px+4)} 130q30-8 42 12q-24-12-42-2zM${f(px+4)} 130q-6-28-30-30q22 6 30 30zM${f(px+4)} 130q8-26 34-26q-26 8-34 26z"/></g>`;
  }else if(st==='night'){
    o+=`<rect width="360" height="250" style="fill:#8B9BC1;stroke:none"/><circle class="fy" cx="${f(r(60,300))}" cy="${f(r(40,70))}" r="20"/>`;
    for(let i=0;i<16;i++)o+=`<circle class="tw" cx="${f(r(5,355))}" cy="${f(r(5,110))}" r="${r(1,2.2).toFixed(1)}" style="animation-delay:-${r(0,2.4).toFixed(1)}s"/>`;
    o+=pl(r(40,300),r(80,110));
    for(let x=-5;x<360;){const w=r(26,44),h=r(50,120),c=pk(['fb','fc','fw','fg']);o+=`<rect class="${c}" x="${f(x)}" y="${f(215-h)}" width="${f(w)}" height="${f(h)}"/>`;
      for(let y=215-h+10;y<205;y+=16)for(let k=8;k<w-8;k+=12)if(R()>.35)o+=`<rect class="fy" x="${f(x+k)}" y="${f(y)}" width="6" height="8" stroke-width="1.5"/>`;x+=w+r(2,8)}

    for(let i=0;i<3;i++){const x=60+i*110+r(-20,20),y=r(30,90),c=pk(['fc','fy','fw']);o+=`<g class="bobber" style="animation-delay:-${i}s"><g transform="translate(${f(x)} ${f(y)})"><path class="${c}" d="M0 0C-26 0-26 40 -6 58h12C26 40 26 0 0 0z"/><path d="M-6 58L-6 70M6 58L6 70"/><rect class="fi" x="-7" y="70" width="14" height="9" rx="2"/></g></g>`}
  }else{

const TZ_OPTS={'依國家自動':'', '日本・韓國（東京/首爾）':'Asia/Tokyo','台灣':'Asia/Taipei','泰國・越南（曼谷/胡志明）':'Asia/Bangkok','新加坡・馬來西亞':'Asia/Singapore','香港・中國':'Asia/Hong_Kong','歐洲中部（巴黎/羅馬）':'Europe/Paris','英國（倫敦）':'Europe/London','美西（洛杉磯）':'America/Los_Angeles','美東（紐約）':'America/New_York','夏威夷':'Pacific/Honolulu','澳洲東部（雪梨）':'Australia/Sydney'};
const CTRY_TZ={日本:'Asia/Tokyo',韓國:'Asia/Seoul',泰國:'Asia/Bangkok',越南:'Asia/Ho_Chi_Minh',新加坡:'Asia/Singapore',歐洲:'Europe/Paris',美國:'America/Los_Angeles'};
const tripTz=()=>{const t=(S.trip&&S.trip.tz)||'';if(TZ_OPTS[t])return TZ_OPTS[t];if(/^[A-Za-z_]+\/[A-Za-z_]+/.test(t))return t;const c=curTrip();return (c&&CTRY_TZ[c.country])||''};
const tzOff=(tz,d)=>{try{const p=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',second:'numeric'}).formatToParts(d).map(x=>[x.type,x.value]));return (Date.UTC(+p.year,+p.month-1,+p.day,+p.hour%24,+p.minute,+p.second)-Math.floor(d/1000)*1000)/60000}catch(e){return null}};
const fmtTz=(tz,d)=>{try{const t=new Intl.DateTimeFormat('zh-TW',{timeZone:tz,hourCycle:'h23',hour:'2-digit',minute:'2-digit',second:'2-digit'}).format(d);const dt=new Intl.DateTimeFormat('zh-TW',{timeZone:tz,month:'numeric',day:'numeric',weekday:'short'}).format(d);return [t,dt]}catch(e){return ['--:--:--','']}};
const clockHidden=()=>{try{return localStorage.getItem('tabi-clock-hide')==='1'}catch(e){return false}};
function toggleClock(){try{localStorage.setItem('tabi-clock-hide',clockHidden()?'0':'1')}catch(e){}clockTick(true)}
function clockTick(force){
  const box=$('#clock');if(!box)return;
  if(clockHidden()){
    if(box.dataset.m!=='h'||force){
      box.dataset.m='h';
      box.innerHTML=`<button type="button" class="btn sm icon-btn off" data-act="clock-toggle" aria-pressed="false" aria-label="顯示時間" title="顯示時間">${SVG_EYE_CLOSE}</button>`;
    }
    return;
  }
  const tz=tripTz(),now=new Date(),same=!tz||tz==='Asia/Taipei';
  const mode=same?'1':'2';
  if(box.dataset.m!==mode||force){
    box.dataset.m=mode;
    box.innerHTML=`<div class="clk-h"><small>${same?'台灣時間':'旅遊地時間 ／ 台灣時間'}</small><button type="button" class="btn sm icon-btn" data-act="clock-toggle" aria-pressed="true" aria-label="隱藏時間" title="隱藏時間">${SVG_EYE_OPEN}</button></div>
    <div class="clk${same?' one':''}">${same?'':'<div class="clk-c" id="clkL"><small>旅遊地</small><b></b><em></em></div>'}<div class="clk-c tw" id="clkT"><small>台灣</small><b></b><em></em></div><div class="clk-diff" id="clkD"></div></div>`;
  }
  const set=(id,tzz)=>{const c=$(id);if(!c)return;const [t,d]=fmtTz(tzz,now);c.querySelector('b').textContent=t;c.querySelector('em').textContent=d};
  set('#clkT','Asia/Taipei');

    set('#clkL',tz);
    const a=tzOff(tz,now),b=tzOff('Asia/Taipei',now),df=$('#clkD');
    if(df&&a!=null&&b!=null){const m=a-b,h=Math.abs(m)/60;df.textContent=m===0?'與台灣時間相同':`旅遊地${m>0?'比台灣快':'比台灣慢'} ${Number.isInteger(h)?h:h.toFixed(1)} 小時`}
  }
}
function tick(){

function hydratePhotos(root){
  $$('img[data-ph]',root||document).forEach(img=>{
    const id=img.dataset.ph;
    if(phCache.has(id)){img.src=phCache.get(id);return}
    if(phLoading.has(id))return;
    phLoading.add(id);
    PH.get(id).then(d=>{
      phLoading.delete(id);
      if(!d)return;
      phCache.set(id,d);
      $$(`img[data-ph="${id}"]`).forEach(x=>{x.src=d});
    }).catch(()=>{phLoading.delete(id)});
  });
}
function loadImg(file){
  return new Promise((res,rej)=>{
    const u=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{URL.revokeObjectURL(u);res(im)};
    im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('bad'))};
    im.src=u;
  });
}
const isGif=f=>!!f&&(f.type==='image/gif'||/\.gif$/i.test(f.name||''));
async function compressImg(file){
  if(isGif(file)){
    if(file.size>MAXF)throw new Error('gif-big');
    return await readFile(file);
  }
  const im=await loadImg(file);
  let max=1280,q=.72;
  for(let k=0;k<6;k++){
    const r=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));
    const c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(im.naturalWidth*r));c.height=Math.max(1,Math.round(im.naturalHeight*r));
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    const out=c.toDataURL('image/jpeg',q);
    if(out.length<700000)return out;
    max*=.8;q=Math.max(.5,q-.05);
  }
  throw new Error('too big');
}
async function uploadPhotos(files,t){
  const L=LISTS[t.list];
  if(!files.length||!find(S[L.key],t.id))return;
  toast('照片處理中…');
  const added=[];let fail=0,denied=false,big=0;
  for(const f of files){
    const isImg=/^image\//.test(f.type)||/\.(jpe?g|png|webp|gif|bmp)$/i.test(f.name);
    try{
      let d=null,file=false;
      if(isImg){try{d=await compressImg(f)}catch(e){d=null}}
      if(!d){
        if(f.size>MAXF){big++;fail++;continue}
        d=await readFile(f);file=true;
      }
      const pid=uid()+uid();
      await PH.set(pid,d);
      if(!file)phCache.set(pid,d);
      added.push(file?{id:pid,name:f.name,file:true,size:f.size}:{id:pid,name:f.name});
    }catch(e){fail++;if(/perm|denied/i.test((e&&e.code)||''))denied=true}
  }
  if(added.length)mutate(()=>{const x=find(S[L.key],t.id);if(x)(x.photos=x.photos||[]).push(...added)});
  toast(added.length?`已加入 ${added.length} 個項目${fail?`，${fail} 個失敗`:''}`:(denied?'沒有上傳權限，請確認 Firestore 規則已加入 photos':(big?'檔案太大，GIF／非圖片檔上限約 650 KB':'上傳失敗，請再試一次')));
}

function applyNavLayout(){
  const main=$('main');
  const foot=$('#foot');
  const secs={};
  $$('main > section').forEach(s=>{secs[s.id]=s});
  Object.values(secs).forEach(s=>s.remove());
  S.nav.order.forEach(id=>{
    const s=secs[id];
    if(!s)return;
    s.hidden=S.nav.hidden.includes(id);
    main.insertBefore(s,foot);
  });
  Object.keys(secs).forEach(id=>{
    if(!S.nav.order.includes(id))main.insertBefore(secs[id],foot);
  });
  main.appendChild(foot);
}
let navIO=null;
function setupNavObserver(){
  if(typeof IntersectionObserver==='undefined')return;
  if(navIO)navIO.disconnect();
  const links=$$('#nav a');
  const map=new Map();
  links.forEach(a=>{
    const el=document.getElementById(a.getAttribute('href').slice(1));
    if(el)map.set(el,a);
  });
  navIO=new IntersectionObserver(entries=>{
    entries.forEach(en=>{
      const a=map.get(en.target);
      if(!a)return;
      if(en.isIntersecting){
        links.forEach(x=>x.classList.remove('on'));
        a.classList.add('on');
      }
    });
  },{rootMargin:'-30% 0px -60% 0px',threshold:0});
  map.forEach((_,el)=>navIO.observe(el));
}

let gmapsPromise=null;

function loadGoogleMaps(){
  if(window.google&&window.google.maps)return Promise.resolve();
  if(!GMAPS_KEY)return Promise.reject(new Error('no-key'));
  if(gmapsPromise)return gmapsPromise;
  gmapsPromise=new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    s.src='https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(GMAPS_KEY)+'&v=weekly&language=zh-TW&region=TW';
    s.async=true;s.defer=true;
    s.onload=()=>resolve();
    s.onerror=()=>reject(new Error('gmaps-load-fail'));
    document.head.appendChild(s);
  });
  return gmapsPromise;
}

function itemLatLng(item){
  const raw=String((item&&item.addr)||'').trim();
  if(!raw)return null;
  let m=/^(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)$/.exec(raw);
  if(m)return[+m[1],+m[2]];
  m=/!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/.exec(raw);
  if(m)return[+m[1],+m[2]];
  m=/@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/.exec(raw);
  if(m)return[+m[1],+m[2]];
  try{
    const href=/^https?:\/\//i.test(raw)?raw:(/^www\./i.test(raw)?'https://'+raw:null);
    if(!href)return null;
    const u=new URL(href);
    for(const k of ['ll','query','q','destination','daddr','center']){
      const v=u.searchParams.get(k);
      if(!v)continue;
      const mm=/^(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)$/.exec(v.trim());
      if(mm)return[+mm[1],+mm[2]];
    }
  }catch(e){}
  return null;
}

function pinSVG(idx,on){
  const w=on?40:32,h=on?50:40;
  const cx=w/2;
  const fill=on?'#FBE7A8':'#FAC9BF';
  const label=String(idx);
  const fs=on?14:12;
  const r=on?11:9.5;
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <path d="M${cx} 0C${cx-8.84} 0 ${cx-16} 7.16 ${cx-16} 16c0 11 16 24 16 24s16-13 16-24C${cx+16} 7.16 ${cx+8.84} 0 ${cx} 0z" fill="${fill}" stroke="#3E3A39" stroke-width="2"/>
    <circle cx="${cx}" cy="16" r="${r}" fill="#FFFFFF" stroke="#3E3A39" stroke-width="1.5"/>
    <text x="${cx}" y="${16+fs*0.36}" text-anchor="middle" font-family="sans-serif" font-size="${fs}" font-weight="700" fill="#3E3A39">${label}</text>
  </svg>`;
  return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(svg);
}

function renderMap(){
  const box=$('#mapview');
  if(!box)return;

  const days=sortedDays();

  if(MV.map&&$('#mvMap')&&MV.map.getDiv()===$('#mvMap')){
    if(!days.some(d=>d.id===MV.day))MV.day=days.length?days[0].id:null;
    renderMapTabs();

  }

  const head=secHead('mapview','看透透','選天數看當天景點與路線。點清單或地圖標記會互相高亮連動。');

  if(!days.length){
    box.innerHTML=head+'<p class="empty">還沒有行程。先到「每日行程」新增景點。</p>';
    return;
  }
  if(!days.some(d=>d.id===MV.day))MV.day=days[0].id;

  const v=++MV.version;
  MV.markers.forEach(m=>{try{m.setMap(null)}catch(e){}});
  MV.markers.clear();
  if(MV.polyline){try{MV.polyline.setMap(null)}catch(e){}}
  MV.polyline=null;MV.infoWin=null;MV.map=null;

  box.innerHTML=head+
    `<div class="mv-tabs" id="mvTabs" role="tablist" aria-label="選擇天數"></div>

  renderMapTabs();

  if(!GMAPS_KEY){
    const el=$('#mvMap');
    if(el)el.innerHTML=`<div class="mv-nokey">
      <p><b>需要 Google Maps API Key</b></p>
      <p>「看透透」使用 Google 地圖圖資，需要一組免費的 Maps JavaScript API Key。</p>
      <ol>
        <li>前往 <a href="https://console.cloud.google.com/google/maps-apis/credentials" target="_blank" rel="noopener">Google Cloud Console</a> 建立專案</li>
        <li>啟用「Maps JavaScript API」並啟用計費（有每月免費額度）</li>
        <li>建立 API Key，貼進程式碼最上方 <code>const GMAPS_KEY=''</code> 的位置</li>
      </ol>
      <p class="mut">一般個人旅行手帳使用量不會超過免費額度；API Key 可設定 HTTP referrer 限制以避免被盜用。</p>
    </div>`;
    renderMapListForDay();
    return;
  }

  loadGoogleMaps().then(()=>{
    if(v!==MV.version)return;
    initGoogleMap();
    renderMapDay();
  }).catch(()=>{
    const el=$('#mvMap');
    if(el)el.innerHTML='<p class="empty" style="margin:1rem">Google 地圖載入失敗，請確認網路、API Key 是否正確，並確認已啟用「Maps JavaScript API」。</p>';
    renderMapListForDay();
  });
}

function renderMapDay(){
  if(!MV.map)return;
  const d=sortedDays().find(x=>x.id===MV.day);
  if(!d)return;
  const items=sortedItems(d);

  if(MV.polyline){try{MV.polyline.setMap(null)}catch(e){}MV.polyline=null}
  MV.markers.forEach(m=>{try{m.setMap(null)}catch(e){}});
  MV.markers.clear();
  if(MV.infoWin)MV.infoWin.close();

  const valid=[];
  items.forEach((it,idx)=>{
    const ll=itemLatLng(it);
    if(!ll)return;
    const pos={lat:ll[0],lng:ll[1]};
    const marker=new google.maps.Marker({
      position:pos,
      map:MV.map,
      title:it.title,
      icon:{url:pinSVG(idx+1,false),scaledSize:new google.maps.Size(32,40),anchor:new google.maps.Point(16,40)}
    });
    marker._idx=idx+1;
    marker.addListener('click',()=>{selectMapItem(it.id,true)});
    MV.markers.set(it.id,marker);
    valid.push({it,ll,pos});
  });

  if(valid.length>1){
    MV.polyline=new google.maps.Polyline({
      path:valid.map(v=>v.pos),
      strokeColor:'#3E3A39',
      strokeOpacity:0.85,
      strokeWeight:2,
      icons:[{icon:{path:'M 0,-1 0,1',strokeOpacity:1,scale:3,strokeColor:'#3E3A39'},offset:'0',repeat:'14px'}],
      map:MV.map
    });
  }

  renderMapList(items);

  if(valid.length===1){MV.map.setCenter(valid[0].pos);MV.map.setZoom(14)}
  else if(valid.length>1){
    const bounds=new google.maps.LatLngBounds();
    valid.forEach(v=>bounds.extend(v.pos));
    MV.map.fitBounds(bounds,40);
  }else{MV.map.setCenter({lat:35.6812,lng:139.7671});MV.map.setZoom(5)}
}

function selectMapItem(id,fromMap){
  if(!MV.map)return;
  $$('#mvList .mv-li').forEach(li=>li.classList.toggle('on',li.dataset.mvid===id));
  MV.markers.forEach((m,mid)=>{
    if(mid===id){
      m.setIcon({url:pinSVG(m._idx,true),scaledSize:new google.maps.Size(40,50),anchor:new google.maps.Point(20,50)});
      m.setZIndex(999);
    }else{
      m.setIcon({url:pinSVG(m._idx,false),scaledSize:new google.maps.Size(32,40),anchor:new google.maps.Point(16,40)});
      m.setZIndex(1);
    }
  });
  const marker=MV.markers.get(id);
  if(!marker)return;
  MV.map.panTo(marker.getPosition());
  const d=sortedDays().find(x=>x.id===MV.day);
  const it=d?find(d.items,id):null;
  if(it&&MV.infoWin){
    MV.infoWin.setContent(popupHtml(it,MV.day));
    MV.infoWin.open({map:MV.map,anchor:marker});

  if(!fromMap){

function waitForMap(cb,max=4000){

}

let lastFocus=null,sheetActs={},sheetLock=false;
function openSheet(html,acts={},opts={}){
  sheetLock=!!opts.lock;
  const sc=$('#scrim');
  $('#sheet').innerHTML=html;
  sheetActs=acts;
  sc.hidden=false;
  document.body.classList.add('lock');
  lastFocus=document.activeElement;
  $('#sheet').scrollTop=0;
  const f=$('#sheet input:not([type=checkbox]):not([type=hidden]), #sheet textarea, #sheet select');
  if(f)f.focus();

}
function closeSheet(){
  $('#scrim').hidden=true;
  $('#sheet').innerHTML='';
  document.body.classList.remove('lock');
  sheetActs={};sheetLock=false;
  if(lastFocus&&lastFocus.focus)lastFocus.focus();
}
$('#scrim').addEventListener('click',e=>{

function openForm({title,fields,values={},onSave}){
  const body=fields.map(f=>{
    const v=values[f.key]??'';
    const span=`<span>${esc(f.label)}${f.req?' <span style="color:#b3553d">*</span>':''}</span>`;
    const cls='fld'+(f.half?' half':'');
    if(f.type==='checkbox'){
      return `<label class="crow"><input type="checkbox" name="${f.key}"${v?' checked':''}><span class="box">${SVG.check}</span><span>${esc(f.label)}</span></label>`;
    }
    if(f.type==='select'){
      const opts=(f.options||[]).map(o=>{
        if(Array.isArray(o))return `<option value="${esc(o[0])}"${o[0]===v?' selected':''}>${esc(o[1])}</option>`;
        return `<option value="${esc(o)}"${o===v?' selected':''}>${esc(o)}</option>`;
      }).join('');
      return `<label class="${cls}">${span}<select name="${f.key}"${f.req?' required':''}>${opts}</select></label>`;
    }
    if(f.type==='textarea'){
      return `<label class="${cls}">${span}<textarea name="${f.key}" placeholder="${esc(f.ph||'')}"${f.req?' required':''}>${esc(v)}</textarea></label>`;
    }
    const t=f.type||'text';
    return `<label class="${cls}">${span}<input type="${t}" name="${f.key}" value="${esc(v)}" placeholder="${esc(f.ph||'')}"${f.req?' required':''}${f.attrs?' '+f.attrs:''}></label>`;
  }).join('');
  openSheet(`<div class="sheet-hd"><h3 id="sheet-t">${esc(title)}</h3><button type="button" class="mini x sheet-x" data-sheet="close" aria-label="關閉">✕</button></div>
    <form id="sheetForm" autocomplete="off">${body}<p class="msg" id="fmsg"></p>
    <div class="sheet-btns"><button type="button" class="btn" data-sheet="close">取消</button><span class="sp"></span><button type="submit" class="btn primary">儲存</button></div></form>`);
  const form=$('#sheetForm');
  form.addEventListener('submit',e=>{
    e.preventDefault();
    const v={};
    fields.forEach(f=>{
      const el=form.elements[f.key];
      if(!el)return;
      if(f.type==='checkbox')v[f.key]=el.checked;
      else v[f.key]=String(el.value).trim();
    });
    const miss=fields.find(f=>f.req&&!String(v[f.key]||'').trim());
    if(miss){$('#fmsg').textContent='請填寫：'+miss.label;const mf=form.elements[miss.key];if(mf)mf.focus();return}
    closeSheet();
    onSave(v);
  });
}

  e.preventDefault();
  const act=nb.dataset.nav,id=nb.dataset.id;
  const order=S.nav.order.slice(),hidden=S.nav.hidden.slice();
  const i=order.indexOf(id);
  if(act==='up'&&i>0){order.splice(i-1,2,order[i],order[i-1])}
  else if(act==='down'&&i>=0&&i<order.length-1){order.splice(i,2,order[i+1],order[i])}
  else if(act==='toggle'&&id!=='top'){
    if(hidden.includes(id)){const k=hidden.indexOf(id);hidden.splice(k,1)}
    else hidden.push(id);
  }else{return}
  S.nav={order,hidden};
  save();

  refreshNav();
});

    e.preventDefault();
    try{e.dataTransfer.dropEffect='move'}catch(err){}
    $$('.rows li.drop').forEach(x=>x.classList.remove('drop'));
    li.classList.add('drop');
    return;
  }
  if(e.dataTransfer&&e.dataTransfer.types&&[...e.dataTransfer.types].includes('Files')){
    const li=e.target.closest&&e.target.closest('li[data-item]');
    if(!li||li.dataset.list!=='todo')return;
    e.preventDefault();
    try{e.dataTransfer.dropEffect='copy'}catch(err){}
    $$('.rows li.drop').forEach(x=>x.classList.remove('drop'));
    li.classList.add('drop');
  }
});
document.addEventListener('drop',e=>{
  const files=e.dataTransfer&&e.dataTransfer.files;
  if(!dragItem&&files&&files.length){
    const li=e.target.closest&&e.target.closest('li[data-item]');
    $$('.rows li.drop').forEach(x=>x.classList.remove('drop'));
    if(!li||li.dataset.list!=='todo')return;
    e.preventDefault();
    uploadPhotos(files,{list:'todo',id:li.dataset.item});
    return;
  }
  if(!dragItem)return;
  const li=e.target.closest&&e.target.closest('li[data-item]');
  $$('.rows li.drop').forEach(x=>x.classList.remove('drop'));
  if(!li||li.dataset.list!==dragList||li.dataset.item===dragItem){dragItem=null;dragList=null;return}
  e.preventDefault();
  const L=LISTS[dragList],items=S[L.key];
  const fromIdx=items.findIndex(x=>x.id===dragItem);
  const toIdx=items.findIndex(x=>x.id===li.dataset.item);
  dragItem=null;dragList=null;
  if(fromIdx<0||toIdx<0)return;
  mutate(()=>{const [m]=items.splice(fromIdx,1);items.splice(toIdx,0,m)});
});

/* 點選待辦項目（用於貼上照片） */
document.addEventListener('click',e=>{
  if(e.target.closest('button,input,label,a'))return;
  const li=e.target.closest&&e.target.closest('#todo li[data-item]');
  if(!li){
    if(phSel){phSel=null;$$('#todo li[data-item]').forEach(x=>x.classList.remove('sel'))}
    return;
  }
  phSel={list:li.dataset.list,id:li.dataset.item};
  $$('#todo li[data-item]').forEach(x=>x.classList.toggle('sel',x===li));
});

/* 貼上照片 */
document.addEventListener('paste',e=>{
  if(!phSel)return;
  const items=e.clipboardData&&e.clipboardData.items;
  if(!items)return;
  const files=[];
  for(const it of items){if(it.kind==='file'){const f=it.getAsFile();if(f)files.push(f)}}
  if(files.length){e.preventDefault();uploadPhotos(files,phSel)}
});

/* 選單設定按鈕 */
const navMenu=$('#navMenu');
if(navMenu)navMenu.addEventListener('click',openNavSettings);

/* 編輯按鈕 */
const editBtn=$('#editBtn');
if(editBtn)editBtn.addEventListener('click',()=>setEditing(!ui.editing));

/* ---------- 初始化 ---------- */
function renderAll(){
  renderTrips();
  applyNavLayout();
  renderNav();
  renderHero();
  renderFlights();
  renderDays(false);
  renderTransit();
  renderMap();
  renderHotels();
  ['todo','prep','pack'].forEach(renderList);
  renderFoot();
  setupNavObserver();
}
document.body.classList.toggle('editing',ui.editing);
const eb=$('#editBtn');if(eb){eb.textContent='編輯';eb.setAttribute('aria-pressed','false')}
renderAll();
initSync();
setInterval(tick,1000);
})();
</script>

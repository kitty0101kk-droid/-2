<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>旅行手帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<style>
:root{
  --paper:#FFFCF6; --white:#FFFFFF; --sand:#FFF1DC;
  --ink:#3E3A39; --ink-soft:#6F6A67;
  --coral:#FFB7AE; --yellow:#FFE59A; --blue:#B8DFF5; --green:#BFE8C0;
  --lav:#DCCDF7; --pink:#FFC8DE; --mint:#BEEBDD; --peach:#FFD2AE;
  --red:#F4786B; --r:32px; --bounce:cubic-bezier(.34,1.56,.64,1);
  --font:'Huninn','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--paper);scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font:400 16px/1.65 var(--font);font-synthesis:none;-webkit-text-size-adjust:100%;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--paper)}
body.lock{overflow:hidden}
h1,h2,h3,h4,p,ol,ul{margin:0;padding:0}
ol,ul{list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px dashed var(--ink);outline-offset:3px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mut{color:var(--ink-soft)}
body:not(.editing) .edit-only{display:none!important}

.ill{display:block}
.ill *{fill:none;stroke:var(--ink);stroke-width:var(--sw,3);stroke-linejoin:round;stroke-linecap:round}
.ill .fc{fill:var(--coral)}.ill .fy{fill:var(--yellow)}.ill .fb{fill:var(--blue)}.ill .fg{fill:var(--green)}
.ill .fw{fill:var(--white)}.ill .fi{fill:var(--ink)}.ill .fn{fill:none}.ill .ns{stroke:none}
.ill .fs{fill:var(--sand)}

.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--paper);border-bottom:2px solid var(--ink)}
.nav-in{display:flex;align-items:center;gap:.5rem;padding-top:.55rem;padding-bottom:.55rem}
.nav.bottom{position:fixed;top:auto;bottom:0;left:0;right:0;border-bottom:0;border-top:2px solid var(--ink);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav.hide{display:none}
body.navb main{padding-bottom:calc(6rem + env(safe-area-inset-bottom,0px))}
body.navb #toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.mini.nb{width:30px;height:30px;font-size:.8rem;flex:none;margin-bottom:3px}
.fab{position:fixed;right:12px;top:40%;z-index:55;width:48px;height:48px;border:2px solid var(--ink);border-radius:50%;background:var(--yellow);display:none;place-items:center;touch-action:none;font-size:1.2rem;padding:0;line-height:1}
.fab.on{display:grid}
.mini:disabled{opacity:.35;cursor:default}
.orglist{margin:.2rem 0}
.orgrow .txt{flex:1;min-width:0}
.legs li.leg{display:block;padding:.6rem 0;border-top:2px dotted var(--ink)}
.legs li.leg:first-child{border-top:0}
.leg-top{display:flex;align-items:center;gap:.5rem}
.leg-top .eb{margin-left:auto}
.leg-top .tm{min-width:3rem;font-variant-numeric:tabular-nums}
.leg-route{overflow-wrap:anywhere;margin:.2rem 0}
.leg-note{font-size:.9rem;color:var(--ink-soft);white-space:pre-line;overflow-wrap:anywhere}
.leg-acts{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.4rem}
.leg-acts .maplink{margin:0}
.leg-chain{margin:.4rem 0 .2rem;font-size:.95rem;overflow-wrap:anywhere}
.leg-mode{display:flex;align-items:center;gap:.5rem;font-size:.85rem;color:var(--ink-soft)}
.leg-mode select{border:2px solid var(--ink);border-radius:999px;background:var(--white);padding:.05rem .6rem;color:var(--ink);min-width:0}
.leg-lbl{display:flex;flex-direction:column;gap:.15rem;margin-top:.5rem;font-size:.85rem;color:var(--ink-soft)}
.leg-ta{display:block;width:100%;min-height:4rem;resize:vertical;border:2px solid var(--ink);border-radius:24px;background:var(--paper);padding:.35rem .8rem;line-height:1.5;color:var(--ink)}
#transit .group{padding-bottom:.8rem}
#nav{display:flex;gap:.4rem;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none;padding:2px 2px 5px}
#nav::-webkit-scrollbar{display:none}
#nav a{flex:none;text-decoration:none;border:2px solid var(--ink);border-radius:999px;padding:.12rem .85rem;background:var(--white);font-size:.95rem;line-height:1.5}
#nav a.on{background:var(--yellow)}
.btn{border:2px solid var(--ink);border-radius:999px;background:var(--white);padding:.25rem 1rem;line-height:1.5;transition:transform .15s var(--bounce),box-shadow .15s}
.btn:active{transform:scale(.95)}
.btn.primary{background:var(--coral)}
.btn.ok{background:var(--green)}
.btn.danger{background:var(--white)}
.btn.sm{padding:.1rem .8rem;font-size:.9rem}
#editBtn{flex:none;margin-bottom:3px}
.sync{flex:none;width:16px;height:16px;border:2px solid var(--ink);border-radius:50%;background:var(--sand);margin-bottom:3px}
.sync[data-s="live"]{background:var(--green)}
.sync[data-s="wait"]{background:var(--yellow)}
.sync[data-s="err"],.sync[data-s="ro"]{background:var(--coral)}
.hint{margin-top:1rem;border:2px dashed var(--ink);border-radius:26px;padding:.5rem .9rem;background:var(--yellow);font-size:.9rem}

main{padding-top:1.2rem;padding-bottom:calc(3rem + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:2.2rem}
.sec{scroll-margin-top:84px;display:flex;flex-direction:column;gap:1rem}
.sec-h{display:flex;align-items:center;gap:.7rem;font-size:1.4rem;line-height:1.3;font-weight:400}
.sec-h .ico{width:48px;height:48px;flex:none;border:2px solid var(--ink);border-radius:24px;display:grid;place-items:center}
.sec-h .ico svg{width:34px;height:34px;--sw:2.5}
.sec-sub{font-size:.9rem;color:var(--ink-soft);margin-top:-.5rem}
.card{background:var(--white);border:2px solid var(--ink);border-radius:var(--r)}

.hero{overflow:hidden;background:var(--paper)}
.hero-ill{width:100%;height:auto;border-bottom:2px solid var(--ink)}
.hero-body{padding:1.1rem 1.1rem 1.3rem;display:flex;flex-direction:column;gap:.7rem}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{border:2px solid var(--ink);border-radius:999px;padding:0 .7rem;font-size:.85rem;background:var(--blue);line-height:1.6}
.chip.y{background:var(--yellow)}
.hero h1{font-size:clamp(1.7rem,7.4vw,2.5rem);line-height:1.25;font-weight:400;text-wrap:balance}
.tagline{color:var(--ink-soft)}
.cd-label{font-size:.85rem;color:var(--ink-soft)}
.clk-h{display:flex;align-items:center;justify-content:space-between;gap:.5rem}
.clk-h small{font-size:.85rem;color:var(--ink-soft)}
.clk{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.clk.one{grid-template-columns:1fr}
.clk-c{border:2px solid var(--ink);border-radius:26px;padding:.4rem .7rem .35rem;min-width:0;background:var(--yellow)}
.clk-c.tw{background:var(--blue)}
.clk-c small{display:block;font-size:.8rem}
.clk-c b{display:block;font-weight:400;font-size:clamp(1.3rem,6.2vw,1.8rem);line-height:1.2;font-variant-numeric:tabular-nums}
.clk-c em{display:block;font-style:normal;font-size:.78rem;color:var(--ink-soft)}
.clk-diff{grid-column:1/-1;font-size:.8rem;color:var(--ink-soft);margin-top:-.1rem}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem}
.cd-t{border:2px solid var(--ink);border-radius:26px;text-align:center;padding:.4rem .2rem .3rem;min-width:0}
.cd-t b{display:block;font-weight:400;font-size:clamp(1.5rem,7.5vw,2.2rem);line-height:1.15;font-variant-numeric:tabular-nums}
.cd-t span{font-size:.8rem}
.cd-t:nth-child(1){background:var(--coral)}.cd-t:nth-child(2){background:var(--yellow)}
.cd-t:nth-child(3){background:var(--blue)}.cd-t:nth-child(4){background:var(--green)}
.cd-msg{grid-column:1/-1;border:2px solid var(--ink);border-radius:26px;background:var(--green);padding:.7rem 1rem;text-align:center;font-size:1.15rem}
.banner{display:flex;align-items:flex-start;gap:.6rem;border:2px solid var(--ink);border-radius:26px;background:var(--yellow);padding:.5rem .5rem .5rem .9rem;font-size:.9rem}
.banner p{flex:1;min-width:0}

.flight{overflow:hidden;position:relative}
.fl-top{display:flex;align-items:center;gap:.6rem;padding:.8rem 1rem .2rem;flex-wrap:wrap}
.dir{border:2px solid var(--ink);border-radius:999px;padding:0 .8rem;font-size:.9rem;background:var(--coral);line-height:1.6}
.dir.back{background:var(--blue)}
.fl-no{flex:1;min-width:0}
.fl-route{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:.4rem;padding:.4rem 1rem .9rem}
.ap{display:flex;flex-direction:column;min-width:0}
.ap b{font-weight:400;font-size:clamp(1.9rem,9vw,2.6rem);line-height:1.1;letter-spacing:.04em}
.ap span{font-size:.85rem;color:var(--ink-soft)}
.ap.r{text-align:right}
.fl-arc{width:100%;height:auto;max-width:150px;margin:0 auto}
.perf{border-top:2px dashed var(--ink);position:relative}
.perf::before,.perf::after{content:"";position:absolute;top:-13px;width:24px;height:24px;border:2px solid var(--ink);border-radius:50%;background:var(--paper)}
.perf::before{left:-15px}.perf::after{right:-15px}
.fl-meta{display:grid;grid-template-columns:1fr 1fr;gap:.6rem 1rem;padding:.9rem 1rem 1rem}
.fl-meta small,.kv small{display:block;font-size:.8rem;color:var(--ink-soft);line-height:1.4}
.fl-meta b,.kv b{font-weight:400}
.fl-note{grid-column:1/-1;font-size:.9rem;white-space:pre-line}
.eb{display:inline-flex;gap:.3rem;flex:none}
.mini{width:34px;height:34px;border:2px solid var(--ink);border-radius:50%;background:var(--white);padding:0;line-height:1;font-size:.95rem;display:grid;place-items:center}
.mini.x{background:var(--coral)}
.fl-top .eb{margin-left:auto}
.add{align-self:flex-start;border:2px dashed var(--ink);border-radius:999px;background:var(--paper);padding:.25rem 1rem;line-height:1.5}

.daytabs{display:flex;gap:.5rem;overflow-x:auto;padding:4px 3px 8px;margin:0 -3px;scrollbar-width:none;scroll-snap-type:x proximity}
.daytabs::-webkit-scrollbar{display:none}
.dt{flex:none;scroll-snap-align:center;min-width:4.6rem;border:2px solid var(--ink);border-radius:28px;background:var(--white);padding:.25rem .5rem .3rem;text-align:center;line-height:1.35}
.dt small{display:block;font-size:.75rem;color:var(--ink-soft)}
.dt b{display:block;font-weight:400;font-size:1.15rem}
.dt[aria-selected="true"]{background:var(--yellow)}
.dt[aria-selected="true"] small{color:var(--ink)}
.dt.bounce{animation:boing .55s var(--bounce)}
.dt.addday{display:grid;place-content:center;background:var(--paper);border-style:dashed;font-size:1.4rem}
.day-head{display:flex;align-items:center;gap:.8rem;padding:.7rem .9rem;background:var(--blue)}
.day-ill{width:76px;flex:none;background:var(--paper);border:2px solid var(--ink);border-radius:26px;padding:4px}
.day-ill svg{width:100%;height:auto;--sw:2.5}
.day-head .t{flex:1;min-width:0}
.day-head small{font-size:.85rem}
.day-head h3{font-size:1.25rem;font-weight:400;line-height:1.35;overflow-wrap:anywhere}
.tl{margin-top:1.1rem}
.tl-i{display:grid;grid-template-columns:3.2rem 22px minmax(0,1fr);column-gap:.45rem;padding-bottom:1rem}
.tl-t{text-align:right;font-size:.95rem;line-height:1.9;font-variant-numeric:tabular-nums;padding-top:.45rem}
.rail{position:relative}
.rail::before{content:"";position:absolute;left:50%;top:0;bottom:-1rem;border-left:2px solid var(--ink);transform:translateX(-50%)}
.tl-i:last-child .rail::before{bottom:auto;height:32px}
.dot{position:absolute;left:50%;top:14px;width:20px;height:20px;margin-left:-10px;border:2px solid var(--ink);border-radius:50%;background:var(--white)}
.dot.must{background:var(--coral);width:24px;height:24px;margin-left:-12px;top:12px}
.tl-c{border:2px solid var(--ink);border-radius:26px;background:var(--white);padding:.55rem .8rem .65rem;min-width:0}
.tl-c.must{background:var(--yellow)}
.tl-tags{display:flex;gap:.35rem;flex-wrap:wrap;align-items:center;margin-bottom:.15rem}
.tl-c h4{font-weight:400;font-size:1.05rem;line-height:1.45;overflow-wrap:anywhere}
.tl-c p{font-size:.88rem;color:var(--ink-soft);white-space:pre-line;overflow-wrap:anywhere}
.tl-c.must p{color:var(--ink)}
.tl-c .eb{margin-top:.4rem}
.tag{border:2px solid var(--ink);border-radius:999px;padding:0 .6rem;font-size:.78rem;line-height:1.6;background:var(--sand)}
.bg-c{background:var(--coral)}.bg-y{background:var(--yellow)}.bg-b{background:var(--blue)}.bg-g{background:var(--green)}.bg-w{background:var(--white)}
.mustb{display:inline-flex;align-items:center;gap:.2rem;border:2px solid var(--ink);border-radius:999px;background:var(--coral);padding:0 .6rem 0 .4rem;font-size:.78rem;line-height:1.6;animation:wiggle 2.8s ease-in-out infinite}
.mustb svg{width:14px;height:14px;--sw:2}
.empty{border:2px dashed var(--ink);border-radius:var(--r);padding:1.2rem;text-align:center;color:var(--ink-soft)}
.pop-in{animation:pop .55s var(--bounce) both;animation-delay:calc(var(--i,0)*70ms)}
#daypanel.swap .day-head{animation:pop .5s var(--bounce) both}

.group{padding:.8rem 1rem .5rem}
.group+.group{margin-top:-.4rem}
.group h3{font-weight:400;font-size:1rem;display:inline-block;border:2px solid var(--ink);border-radius:999px;padding:0 .8rem;background:var(--blue);line-height:1.6;margin-bottom:.3rem}
.rows li{display:flex;align-items:center;gap:.5rem;padding:.35rem 0;border-top:2px dotted var(--ink)}
.rows li:first-child{border-top:0}
.chk{display:flex;align-items:center;gap:.7rem;flex:1;min-width:0;cursor:pointer;position:relative}
.chk input{position:absolute;opacity:0;width:28px;height:28px;margin:0}
.box{flex:none;width:28px;height:28px;border:2px solid var(--ink);border-radius:10px;background:var(--white);display:grid;place-items:center}
.box svg{width:18px;height:18px;opacity:0;--sw:3.5}
.chk input:checked~.box{background:var(--red)}
.chk input:checked~.box svg{opacity:1}
.chk input:focus-visible~.box{outline:2px dashed var(--ink);outline-offset:3px}
.chk .txt{min-width:0;overflow-wrap:anywhere}
li.done .txt{color:var(--ink-soft);text-decoration:line-through;text-decoration-thickness:2px}
.box.boing{animation:boing .5s var(--bounce)}
.addrow{display:flex;gap:.5rem;flex-wrap:wrap;padding:.6rem 1rem 1rem;border-top:2px dashed var(--ink)}
.addrow input{flex:1 1 9rem;min-width:0;border:2px solid var(--ink);border-radius:999px;background:var(--paper);padding:.2rem .9rem}
.addrow input[name="cat"]{flex:0 1 7rem}
.addrow select{flex:0 1 8.5rem;min-width:0;border:2px solid var(--ink);border-radius:999px;background:var(--paper);padding:.2rem .9rem}
.mk{flex:none;border:2px solid var(--ink);border-radius:999px;background:var(--blue);padding:0 .6rem;font-size:.8rem;line-height:1.6;margin-left:.2rem;white-space:nowrap}
.listcard{overflow:hidden}
.nothing{padding:.9rem 1rem 0;color:var(--ink-soft);font-size:.9rem}
.rows li{flex-wrap:wrap}
.ph-strip{flex:0 0 100%;display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;padding:.1rem 0 .3rem 2.4rem}
body:not(.editing) .ph-strip:not(.has){display:none}
.ph-th{width:64px;height:64px;padding:0;border:2px solid var(--ink);border-radius:20px;overflow:hidden;background:var(--sand);flex:none}
.ph-th img{display:block;width:100%;height:100%;object-fit:cover}
img[data-ph]:not([src]){visibility:hidden}
.ph-add{border:2px dashed var(--ink);border-radius:999px;background:var(--paper);padding:0 .8rem;font-size:.85rem;line-height:1.7}
.ph-big{display:block;width:100%;max-height:60vh;object-fit:contain;border:2px solid var(--ink);border-radius:24px;background:var(--white);min-height:4rem}
.sec[hidden]{display:none}
.ph-file{max-width:100%;border:2px solid var(--ink);border-radius:999px;background:var(--blue);padding:0 .8rem;font-size:.85rem;line-height:1.7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rows li.sel{background:var(--paper);border-radius:16px}
.rows li.drop{background:var(--yellow);outline:2px dashed var(--ink);outline-offset:-3px;border-radius:16px}

.hotel{overflow:hidden}
.hotel-h{display:flex;align-items:center;gap:.7rem;background:var(--yellow);border-bottom:2px solid var(--ink);padding:.7rem 1rem}
.hotel-h h3{font-weight:400;font-size:1.15rem;line-height:1.4;flex:1;min-width:0;overflow-wrap:anywhere}
.nights{flex:none;border:2px solid var(--ink);border-radius:999px;background:var(--white);padding:0 .7rem;font-size:.85rem;line-height:1.6}
.hotel-b{padding:.9rem 1rem 1rem;display:flex;flex-direction:column;gap:.7rem}
.kvs{display:grid;grid-template-columns:1fr 1fr;gap:.6rem 1rem}
.kv{min-width:0}
.kv.w{grid-column:1/-1}
.kv b{overflow-wrap:anywhere}
.kv .acts{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.3rem}
.kv .acts .btn{padding:0 .8rem;font-size:.85rem;text-decoration:none;display:inline-block}
.note{font-size:.9rem;white-space:pre-line;color:var(--ink-soft)}

footer{display:flex;flex-direction:column;align-items:center;gap:.6rem;text-align:center;padding-top:.5rem}
.cat{width:110px;height:auto}
footer p{font-size:.88rem;color:var(--ink-soft);max-width:30em}
.foot-btns{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center}
.gate{position:fixed;inset:0;z-index:200;background:var(--paper);display:grid;place-items:center;padding:20px}
.gate-card{width:100%;max-width:360px;background:var(--white);border:2px solid var(--ink);border-radius:var(--r);padding:1.4rem 1.2rem;display:flex;flex-direction:column;gap:.8rem;text-align:center}
.gate-card h1{font-size:1.7rem;font-weight:400;line-height:1.3}
.gate-card input{width:100%;border:2px solid var(--ink);border-radius:999px;background:var(--paper);padding:.35rem 1rem;text-align:center;font-size:1.2rem;letter-spacing:.3em}
#gmsg{min-height:1.4em;font-size:.9rem}
.maplink{display:inline-block;text-decoration:none;margin-top:.4rem;margin-right:.4rem}
.loc{overflow-wrap:anywhere}
.rows li.trrow{flex-wrap:wrap;gap:.4rem .6rem}
.trrow .tm{min-width:3rem;font-variant-numeric:tabular-nums}
.cards{display:flex;flex-direction:column;gap:.8rem}
.cards .group+.group{margin-top:0}
.gh{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.gh h3{margin-bottom:0}
.gh .eb{margin-left:auto}
.gh .cnt{font-size:.8rem;color:var(--ink-soft)}
.subadd{display:flex;gap:.5rem;padding:.5rem 0 .3rem;border-top:2px dotted var(--ink);margin-top:.2rem}
.subadd input{flex:1;min-width:0;border:2px solid var(--ink);border-radius:999px;background:var(--paper);padding:.1rem .8rem}
.subadd .btn{padding:0 .9rem;font-size:.9rem}
.newcat{display:flex;gap:.5rem;border:2px dashed var(--ink);border-radius:var(--r);padding:.6rem .8rem}
.newcat input{flex:1;min-width:0;border:2px solid var(--ink);border-radius:999px;background:var(--paper);padding:.2rem .9rem}

.scrim{position:fixed;inset:0;z-index:80;background:rgba(62,58,57,.38);display:flex;align-items:center;justify-content:center;padding:16px}
.scrim[hidden]{display:none}
.sheet{width:100%;max-width:520px;max-height:86vh;max-height:86dvh;overflow-y:auto;background:var(--paper);border:2px solid var(--ink);border-radius:36px;padding:1.1rem 1.2rem 1.2rem;animation:sheetPop .45s var(--bounce)}
.sheet h3{font-weight:400;font-size:1.3rem;margin-bottom:.8rem}
/* 修正：欄位不再撐破格子、邊框不再互相重疊 */
.sheet form{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.8rem 1rem}
.fld{grid-column:1/-1;display:flex;flex-direction:column;gap:.15rem;min-width:0;max-width:100%}
.fld.half{grid-column:auto}
.fld>span{font-size:.85rem;color:var(--ink-soft)}
.fld input,.fld select,.fld textarea,.sheet textarea{display:block;width:100%;min-width:0;max-width:100%;border:2px solid var(--ink);border-radius:24px;background:var(--white);padding:.3rem .8rem;line-height:1.5;text-align:left}

function normalize(o){
  if(!o||typeof o!=='object'||!o.trip) return null;
  const arr=k=>Array.isArray(o[k])?o[k]:[];
  const fix=a=>a.map(x=>({...x,id:x.id||uid()}));
  return {sample:!!o.sample,cover:{mode:'scene',style:'classic',seed:1,...(o.cover||{})},trip:{title:'',tagline:'',depart:'',back:'',tz:'',...o.trip},flights:fix(arr('flights')),

    hotels:fix(arr('hotels')),todos:fix(arr('todos')),todoCats:Array.isArray(o.todoCats)?o.todoCats.slice():[...new Set(arr('todos').map(i=>i.cat||'未分類'))],prep:fix(arr('prep')),pack:fix(arr('pack')),notes:fix(arr('notes')),ledger:(o.ledger&&typeof o.ledger==='object')?{cur:o.ledger.cur||'',members:fix(Array.isArray(o.ledger.members)?o.ledger.members:[]),items:fix(Array.isArray(o.ledger.items)?o.ledger.items:[])}:null,noteCats:Array.isArray(o.noteCats)?o.noteCats.slice():[...new Set(['行李箱帶的東西','出門前要帶的東西',...arr('notes').map(i=>i.cat||'其他')])]};
}

  const d=normalize(o);return d?{trips:[{id:'t1',name:(d.trip.title||'我的旅行').slice(0,10),country:'日本',scope:'abroad',data:d}]}:null;
}
const mkRoot=()=>({trips:[{id:'t1',name:'東京・京都',country:'日本',scope:'abroad',data:normalize(sample())}]});
function load(){try{const r=localStorage.getItem(KEY);if(r){const n=normRoot(JSON.parse(r));if(n)return n}}catch(e){}return mkRoot()}
const curTrip=()=>ROOT.trips.find(t=>t.id===ui.trip)||ROOT.trips[0];
function setAct(id){ui.trip=id;try{localStorage.setItem('tabi-techo-act',id)}catch(e){}}
function setRoot(r){ROOT=r;S=curTrip().data}
let ROOT=load(),S=null;
let saveWarned=false;
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(ROOT))}catch(e){if(!saveWarned){saveWarned=true;toast('這個瀏覽器無法儲存，重新整理後資料會消失。可到頁尾「備份與還原」複製備份。')}}

}
// unlocked＝可編輯：未設定 Firebase 時為本機模式（直接可編輯）；設定後需用允許名單內的 Google 帳號登入
const ui={editing:false,day:null,lastCat:'其他',unlocked:!FB_ON,user:null,trip:null};
try{ui.trip=localStorage.getItem('tabi-techo-act')}catch(e){}
S=curTrip().data;
let auth=null,AU=null;

/* ---------- 共同編輯同步 ---------- */
let dbDoc=null,syncState='local',lastJson='',remoteJson='',deferred=null,pushT=0,firstSnap=true;
const SYNC_TXT={local:'尚未連線，目前只存在這台裝置（登入 Google 後可跨裝置同步）',wait:'同步中…',live:'已連線：所有人的修改會即時同步',ro:'這個 Google 帳號沒有編輯權限，修改不會同步',err:'同步失敗，會再自動重試'};
function setSync(s){
  syncState=s;
  const d=$('#syncDot');if(d){d.dataset.s=s;d.title='同步狀態：'+SYNC_TXT[s];d.setAttribute('aria-label','同步狀態：'+SYNC_TXT[s])}
  const t=$('#syncTxt');if(t)t.textContent=SYNC_TXT[s];
}
function push(){
  if(!dbDoc||!ui.unlocked||firstSnap)return;
  clearTimeout(pushT);
  pushT=setTimeout(async()=>{
    const json=JSON.stringify(ROOT);
    if(json===lastJson)return;
    setSync('wait');
    try{
      await dbDoc.set({json,at:Date.now()});
      lastJson=json;remoteJson=json;setSync('live');
      if(JSON.stringify(ROOT)!==json)push();
    }catch(e){
      if(/perm|denied|grant|auth/i.test((e&&e.code)||'')){
        setSync('ro');toast('沒有寫入權限，這次的修改沒有同步');
        if(remoteJson){lastJson=remoteJson;applyRemote(remoteJson,true)}
      }else{setSync('err');pushT=setTimeout(push,5000)}
    }
  },500);
}
const busy=()=>{
  if(!$('#scrim').hidden||ui.renaming)return true;
  const a=document.activeElement;
  return !!(a&&a.matches&&a.matches('main input[name="text"],main input[name="cat"],main input[name="newcat"],main textarea.leg-ta')&&a.value);
};
function applyRemote(json,force){
  if(json===JSON.stringify(ROOT)){lastJson=json;return}
  if(!force&&ui.unlocked&&JSON.stringify(ROOT)!==lastJson)return; // 自己還有沒送出的修改，以自己的為準
  if(!force&&busy()){deferred=json;setTimeout(flush,1500);return}
  let n=null;try{n=normRoot(JSON.parse(json))}catch(e){}
  if(!n)return;
  setRoot(n);lastJson=json;
  try{localStorage.setItem(KEY,JSON.stringify(ROOT))}catch(e){}
  renderAll();
}
function flush(){
  if(deferred==null)return;
  if(busy()){setTimeout(flush,1500);return}
  const j=deferred;deferred=null;applyRemote(j);
}
async function initSync(){
  if(!FB_ON){setSync('local');return}
  try{
    const B='https://www.gstatic.com/firebasejs/10.12.2/';
    const [{initializeApp},A,D]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')]);
    const app=initializeApp(FB);
    AU=A;auth=A.getAuth(app);
    A.setPersistence&&A.setPersistence(auth,A.browserLocalPersistence).catch(()=>{});
    const fdb=D.getFirestore(app);
    const ref=D.doc(fdb,'trips','main');
    PH={
      set:(id,d)=>D.setDoc(D.doc(fdb,'photos',id),{data:d,at:Date.now()}),
      get:async id=>{const s=await D.getDoc(D.doc(fdb,'photos',id));return s.exists()?s.data().data:null}
    };
    dbDoc={set:d=>D.setDoc(ref,d),onSnapshot:(ok,er)=>D.onSnapshot(ref,s=>ok({exists:s.exists(),data:()=>s.data()}),er)};
    A.onAuthStateChanged(auth,u=>{
      ui.user=u;
      const em=u&&(u.email||'').toLowerCase();
      ui.unlocked=!!u&&(!EDITORS.length||EDITORS.map(x=>x.toLowerCase()).includes(em));
      if(!ui.unlocked&&ui.editing)setEditing(false);
      renderFoot();
      if(u&&!ui.unlocked){setSync('ro')}
      else if(ui.unlocked){setSync('live');push()}
    });
    setSync('wait');
    const timer=setTimeout(()=>{if(firstSnap)setSync('local')},10000);
    dbDoc.onSnapshot(snap=>{
      clearTimeout(timer);
      const d=snap.exists?snap.data():null;
      if(d&&typeof d.json==='string'){
        remoteJson=d.json;
        if(firstSnap){firstSnap=false;applyRemote(d.json,true)}else applyRemote(d.json);
        if(syncState!=='ro'&&syncState!=='wait')setSync('live');
      }else{
        firstSnap=false;
        setSync('live');
        if(ui.unlocked)push();
      }
    },()=>{setSync('local')});
  }catch(e){setSync('local')}
}

const parseD=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||'');return m?new Date(+m[1],+m[2]-1,+m[3]):null};
const md=s=>{const d=parseD(s);return d?`${d.getMonth()+1}/${d.getDate()}`:''};
const wk=s=>{const d=parseD(s);return d?'週'+'日一二三四五六'[d.getDay()]:''};
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const nl=s=>esc(s);
const asUrl=a=>{const s=String(a||'').trim();if(!s||/\s/.test(s))return '';if(/^https?:\/\//i.test(s))return s;if(/^(www\.)?(maps\.app\.goo\.gl|goo\.gl\/maps|google\.[a-z.]+\/maps|maps\.google\.[a-z.]+)/i.test(s))return 'https://'+s;return ''};
const mapUrl=a=>asUrl(a)||'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(a);
const urlPlace=u=>{try{const x=new URL(u);let h=x.href;try{h=decodeURIComponent(h)}catch(e){}
  let m=h.match(/!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/);if(m)return m[1]+','+m[2];
  m=x.pathname.match(/\/(?:place|search)\/([^/@]+)/);if(m){let n=m[1].replace(/\+/g,' ');try{n=decodeURIComponent(n)}catch(e){}if(n.trim())return n.trim()}
  for(const k of ['destination','daddr','query','q']){const v=x.searchParams.get(k);if(v)return v}
  m=x.pathname.match(/@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/);if(m)return m[1]+','+m[2];
}catch(e){}return ''};
/* 查看路線：有填「地址/網址」就直接用它當出發地／目的地（網址能解析出座標或地名就用精準值，解析不出來（如短網址）就整條網址原樣帶入）；沒填才用地點名稱 */
const placeText=x=>{const raw=String(x.addr||'').trim();if(!raw)return x.title||'';const u=asUrl(raw);return u?(urlPlace(u)||u):raw};
const addrShow=a=>{const u=asUrl(a);if(!u)return a;try{return '地圖連結（'+new URL(u).hostname.replace(/^www\./,'')+'）'}catch(e){return a}};
const mapBtn=a=>`<a class="btn sm maplink" href="${esc(mapUrl(a))}" target="_blank" rel="noopener">地圖</a>`;
const TR={'飛機':'bg-b','電車':'bg-g','新幹線':'bg-c','地鐵':'bg-g','巴士':'bg-y','計程車':'bg-y','租車':'bg-y','渡輪':'bg-b','步行':'bg-w','其他':''};
const TRS=Object.keys(TR);
const sortedDays=()=>[...S.days].sort((a,b)=>(a.date||'').localeCompare(b.date||''));
const sortedItems=d=>[...d.items].map((x,i)=>[x,i]).sort((a,b)=>((a[0].time||'99:99').localeCompare(b[0].time||'99:99'))||a[1]-b[1]).map(x=>x[0]);

let toastTimer=0;
function toast(msg,undo){
  const t=$('#toast');t.innerHTML=`<span>${esc(msg)}</span>${undo?'<button type="button" id="undoBtn">復原</button>':''}`;t.hidden=false;
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.hidden=true},undo?6000:3200);
  if(undo)$('#undoBtn').onclick=()=>{undo();t.hidden=true};
}
function mutate(fn,msg,withUndo){
  const snap=JSON.stringify(ROOT);fn();save();renderAll();
  if(msg)toast(msg,withUndo?()=>{setRoot(normRoot(JSON.parse(snap)));save();renderAll()}:null);
}
async function copyText(t){
  try{await navigator.clipboard.writeText(t);return true}catch(e){
    try{const ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();return ok}catch(e2){return false}
  }
}

    o+=pl(r(40,300),r(80,110));

      for(let y=215-h+10;y<205;y+=16)for(let k=8;k<w-8;k+=12)if(R()>.35)o+=`<rect class="fy" x="${f(x+k)}" y="${f(y)}" width="6" height="8" stroke-width="1.5"/>`;x+=w+r(2,8)}

const TZ_OPTS={'依國家自動':'', '日本・韓國（東京/首爾）':'Asia/Tokyo','台灣':'Asia/Taipei','泰國・越南（曼谷/胡志明）':'Asia/Bangkok','新加坡・馬來西亞':'Asia/Singapore','香港・中國':'Asia/Hong_Kong','歐洲中部（巴黎/羅馬）':'Europe/Paris','英國（倫敦）':'Europe/London','美西（洛杉磯）':'America/Los_Angeles','美東（紐約）':'America/New_York','夏威夷':'Pacific/Honolulu','澳洲東部（雪梨）':'Australia/Sydney'};
const CTRY_TZ={日本:'Asia/Tokyo',韓國:'Asia/Seoul',泰國:'Asia/Bangkok',越南:'Asia/Ho_Chi_Minh',新加坡:'Asia/Singapore',歐洲:'Europe/Paris',美國:'America/Los_Angeles'};
const tripTz=()=>{const t=(S.trip&&S.trip.tz)||'';if(TZ_OPTS[t])return TZ_OPTS[t];if(/^[A-Za-z_]+\/[A-Za-z_]+/.test(t))return t;const c=curTrip();return (c&&CTRY_TZ[c.country])||''};
const tzOff=(tz,d)=>{try{const p=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',second:'numeric'}).formatToParts(d).map(x=>[x.type,x.value]));return (Date.UTC(+p.year,+p.month-1,+p.day,+p.hour%24,+p.minute,+p.second)-Math.floor(d/1000)*1000)/60000}catch(e){return null}};
const fmtTz=(tz,d)=>{try{const t=new Intl.DateTimeFormat('zh-TW',{timeZone:tz,hourCycle:'h23',hour:'2-digit',minute:'2-digit',second:'2-digit'}).format(d);const dt=new Intl.DateTimeFormat('zh-TW',{timeZone:tz,month:'numeric',day:'numeric',weekday:'short'}).format(d);return [t,dt]}catch(e){return ['--:--:--','']}};
const clockHidden=()=>{try{return localStorage.getItem('tabi-clock-hide')==='1'}catch(e){return false}};

function clockTick(force){
  const box=$('#clock');if(!box)return;
  if(clockHidden()){if(box.dataset.m!=='h'||force){box.dataset.m='h';box.innerHTML=`<button type="button" class="btn sm eyeb" data-act="clock-toggle" aria-pressed="false" aria-label="顯示當地／台灣時間">${SVG.eyeClosed}<span>當地／台灣時間</span></button>`}return}
  const tz=tripTz(),now=new Date(),same=!tz||tz==='Asia/Taipei';
  const mode=same?'1':'2';
  if(box.dataset.m!==mode||force){
    box.dataset.m=mode;
    box.innerHTML=`<div class="clk-h"><small>${same?'台灣時間':'旅遊地時間 ／ 台灣時間'}</small><button type="button" class="mini eyeb" data-act="clock-toggle" aria-pressed="true" aria-label="隱藏時間" title="隱藏時間">${SVG.eyeOpen}</button></div>
    <div class="clk${same?' one':''}">${same?'':'<div class="clk-c" id="clkL"><small>旅遊地</small><b></b><em></em></div>'}<div class="clk-c tw" id="clkT"><small>台灣</small><b></b><em></em></div><div class="clk-diff" id="clkD"></div></div>`;
  }
  const set=(id,tzz)=>{const c=$(id);if(!c)return;const [t,d]=fmtTz(tzz,now);c.querySelector('b').textContent=t;c.querySelector('em').textContent=d};

  }
}

function hydratePhotos(root){
  $$('img[data-ph]',root||document).forEach(img=>{
    const id=img.dataset.ph;
    if(phCache.has(id)){img.src=phCache.get(id);return}
    if(phLoading.has(id))return;
    phLoading.add(id);
    PH.get(id).then(d=>{
      phLoading.delete(id);

    }).catch(()=>{phLoading.delete(id)});
  });

function loadImg(file){
  return new Promise((res,rej)=>{
    const u=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{URL.revokeObjectURL(u);res(im)};
    im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('bad'))};
    im.src=u;
  });
}
const isGif=f=>!!f&&(f.type==='image/gif'||/\.gif$/i.test(f.name||''));
async function compressImg(file){
  if(isGif(file)){ // GIF 不經過 canvas 壓縮，直接保留動畫
    if(file.size>MAXF)throw new Error('gif-big');
    return await readFile(file);
  }
  const im=await loadImg(file);
  let max=1280,q=.72;
  for(let k=0;k<6;k++){
    const r=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));
    const c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(im.naturalWidth*r));c.height=Math.max(1,Math.round(im.naturalHeight*r));
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    const out=c.toDataURL('image/jpeg',q);
    if(out.length<700000)return out;
    max*=.8;q=Math.max(.5,q-.05);
  }
  throw new Error('too big');
}

async function uploadPhotos(files,t){
  const L=LISTS[t.list];
  if(!files.length||!find(S[L.key],t.id))return;
  toast('照片處理中…');
  const added=[];let fail=0,denied=false;
  let big=0;
  for(const f of files){
    const isImg=/^image\//.test(f.type)||/\.(jpe?g|png|webp|gif|bmp)$/i.test(f.name);
    try{
      let d=null,file=false;
      if(isImg){try{d=await compressImg(f)}catch(e){d=null}}
      if(!d){
        if(f.size>MAXF){big++;fail++;continue}
        d=await readFile(f);file=true;
      }
      const pid=uid()+uid();
      await PH.set(pid,d);
      if(!file)phCache.set(pid,d);
      added.push(file?{id:pid,name:f.name,file:true,size:f.size}:{id:pid,name:f.name});
    }catch(e){fail++;if(/perm|denied/i.test((e&&e.code)||''))denied=true}
  }
  if(added.length)mutate(()=>{const x=find(S[L.key],t.id);if(x)(x.photos=x.photos||[]).push(...added)});
  toast(added.length?`已加入 ${added.length} 個項目${fail?`，${fail} 個失敗`:''}`:(denied?'沒有上傳權限，請確認 Firestore 規則已加入 photos':(big?'檔案太大，GIF／非圖片檔上限約 650 KB':'上傳失敗，請再試一次')));
}

async function geoQuery(q,cc){
  const key=cc+'|'+q;
  if(Object.prototype.hasOwnProperty.call(geoCache,key))return geoCache[key]||null;
  const w=1100-(Date.now()-geoLast);if(w>0)await new Promise(r=>setTimeout(r,w));
  geoLast=Date.now();
  try{
    const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language=zh-TW'+(cc?'&countrycodes='+cc:'')+'&q='+encodeURIComponent(q));
    if(!r.ok)return null;
    const a=await r.json();
    const v=a&&a[0]?[+(+a[0].lat).toFixed(6),+(+a[0].lon).toFixed(6)]:0;
    geoCache[key]=v;geoSave();return v||null;
  }catch(e){return null}
}
/* 搜尋時補上縣市／國家，讓同名地點不會跑到別處 */
function exQual(q){
  const t=curTrip()||{};
  if(!q||COORD.test(q))return q;
  if(isDom(t)&&t.region&&!TW_SPECIAL.includes(t.region)&&!q.includes(t.region.slice(0,2)))q=t.region+' '+q;
  const ct=t.country;
  if(ct&&ct!=='其他'&&!q.includes(ct))q+=' '+ct;
  return q;
}
async function exResolve(p,tok){
  if(p.ll)return p.ll;
  const cc=exCC();
  for(const q of (p.qs||[]).slice(0,3)){
    if(tok!==exTok)return null;
    const v=await geoQuery(exQual(q),cc);
    if(v)return v;
  }
  return null;
}
function exInfoMap(msg){

}
function exFit(){
  if(!exMapObj)return;
  const ms=Object.values(exMk);if(!ms.length)return;
  const an=!reduced();
  if(ms.length===1){exMapObj.setView(ms[0].getLatLng(),15,{animate:an});return}
  exMapObj.fitBounds(L.latLngBounds(ms.map(m=>m.getLatLng())),{padding:[44,44],maxZoom:16,animate:an});
}
async function exBuildMap(pts,tok){
  const box=$('#exG');if(!box)return;
  const sig=ui.exDay+'#'+pts.map(p=>[p.key,p.n,p.title,p.x.addr||'',(p.qs||[]).join('/'),p.ll||''].join('|')).join(';')+'#'+exQual('x');
  if(sig===exSig&&exMapObj&&box.contains(exMapObj.getContainer())){exMapObj.invalidateSize();exInfoMap();return}
  exSig=sig;exFail=new Set();exMk={};
  if(exMapObj){try{exMapObj.remove()}catch(e){}exMapObj=null}
  box.innerHTML='<div id="exMapEl" class="exmapel"></div>';
  const cc=exCC(),map=exMapObj=L.map('exMapEl',{scrollWheelZoom:false}).setView(EX_CEN[cc]||[25,121],cc==='tw'?8:5);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
  const ink=(getComputedStyle(document.body).getPropertyValue('--ink')||'').trim()||'#4a3b32';
  const line=L.polyline([],{color:ink,weight:3,opacity:.65,dashArray:'7 9'}).addTo(map);
  const total=pts.length;let done=0,found=0;
  exInfoMap(`定位中 0 / ${total}…`);
  for(const p of pts){
    if(tok!==exTok)return;
    const ll=await exResolve(p,tok);
    if(tok!==exTok)return;
    done++;
    if(ll){
      found++;
      const hot=p.kind==='hotel',col=hot?'#FFFFFF':EX_PAL[Math.max(0,p.day)%EX_PAL.length];
      const icon=L.divIcon({className:'exmk-w',html:`<div class="exmk${hot?' hot':''}" style="background:${col}">${hot?'宿':p.n}</div>`,iconSize:[32,32],iconAnchor:[16,16],popupAnchor:[0,-18]});
      const mk=L.marker(ll,{icon,title:p.title,riseOnHover:true}).addTo(map);
      mk.bindPopup(`<b>${esc(p.title)}</b><br><small>${hot?'住宿':`Day ${p.day+1}${p.time?' · '+esc(p.time):''}`}</small><br><a href="${esc(mapUrl(p.x.addr||exQual((p.qs&&p.qs[0])||p.title)))}" target="_blank" rel="noopener">在 Google 地圖開啟</a>`);
      exMk[p.key]=mk;
      line.setLatLngs(pts.filter(z=>z.kind==='item'&&exMk[z.key]).map(z=>exMk[z.key].getLatLng()));
      if(found===1)map.setView(ll,15);else exFit();
    }else{
      exFail.add(p.key);
      const b=document.querySelector(`.exrow[data-key="${p.key}"]`);if(b)b.classList.add('off');
    }
    exInfoMap(`定位中 ${done} / ${total}…`);
  }
  exInfoMap(found?`已標出 ${found} 個地點${found<total?`，另有 ${total-found} 個找不到位置（清單中顏色較淡）`:''}，編號對應下方清單`:'找不到這天地點的位置；請在行程填上地址或 Google 地圖網址，或按「在 Google 地圖開啟」');
  setTimeout(()=>{try{map.invalidateSize()}catch(e){}},60);
}

/* 電腦版：兩欄排版時，落單的那一欄自動撐滿整排，避免半邊空白 */
function fixGrid(){
  const main=$('main');if(!main)return;
  const FULL=new Set(['top','days','transit','explore','ledger','foot']);
  let run=[];
  const flush=()=>{if(run.length%2===1)run[run.length-1].classList.add('span2');run=[]};
  [...main.children].forEach(el=>{
    el.classList.remove('span2');
    if(el.hidden)return;
    if(FULL.has(el.id)){flush();return}
    if(el.classList.contains('sec'))run.push(el);
  });
  flush();
}

/* ---------- 記帳／自動分帳（每個旅程可自行新增；資料存在該旅程裡並同步） ---------- */
const LG_CUR={日本:'JPY',韓國:'KRW',泰國:'THB',越南:'VND',新加坡:'SGD',美國:'USD',台灣:'TWD'};
const money=n=>(Math.round(n*100)/100).toLocaleString('en-US',{maximumFractionDigits:2});
function ledgerCalc(){
  const g=S.ledger,bal={},paid={},owe={};
  g.members.forEach(m=>{bal[m.id]=0;paid[m.id]=0;owe[m.id]=0});
  let total=0;
  g.items.forEach(it=>{
    const a=+it.amount||0;if(!(it.payer in bal))return;
    total+=a;paid[it.payer]+=a;bal[it.payer]+=a;
    const sp=(it.split||[]).filter(id=>id in bal);if(!sp.length)return;
    const each=a/sp.length;sp.forEach(id=>{owe[id]+=each;bal[id]-=each});
  });
  const cr=[],db=[];
  g.members.forEach(m=>{const b=Math.round(bal[m.id]*100)/100;if(b>0.005)cr.push({id:m.id,v:b});else if(b<-0.005)db.push({id:m.id,v:-b})});
  cr.sort((a,b)=>b.v-a.v);db.sort((a,b)=>b.v-a.v);
  const tx=[];let i=0,j=0;
  while(i<cr.length&&j<db.length){
    const t=Math.min(cr[i].v,db[j].v);tx.push({from:db[j].id,to:cr[i].id,v:t});
    cr[i].v-=t;db[j].v-=t;if(cr[i].v<0.005)i++;if(db[j].v<0.005)j++;
  }
  return {bal,paid,owe,total,tx};
}

let lastFocus=null,sheetActs={},sheetLock=false;
function openSheet(html,acts={},opts={}){
  sheetLock=!!opts.lock;
  const sc=$('#scrim');$('#sheet').innerHTML=html;sheetActs=acts;sc.hidden=false;document.body.classList.add('lock');
  lastFocus=document.activeElement;$('#sheet').scrollTop=0;
  const f=$('#sheet input:not([type=checkbox]),#sheet textarea,#sheet select');(f||$('#sheet button')).focus({preventScroll:true});
}
function closeSheet(){sheetLock=false;$('#scrim').hidden=true;document.body.classList.remove('lock');sheetActs={};lastFocus&&lastFocus.focus&&lastFocus.focus({preventScroll:true});flush()}
$('#scrim').addEventListener('click',e=>{
  if(e.target.id==='scrim'){if(!sheetLock)closeSheet();return}
  const b=e.target.closest('[data-sheet]');if(!b)return;
  const k=b.dataset.sheet;if(k==='close')closeSheet();else sheetActs[k]?.(b);
});
$('#scrim').addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(!sheetLock)closeSheet();return}
  if(e.key!=='Tab')return;
  const els=$$('#sheet button,#sheet input,#sheet select,#sheet textarea').filter(x=>!x.disabled&&x.offsetParent!==null||x.type==='checkbox');
  if(!els.length)return;const a=els[0],z=els[els.length-1];
  if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}
});
function fieldHtml(f,v){
  const id='ff-'+f.key,req=f.req?' required':'',half=f.half?' half':'';
  if(f.type==='checkbox')return `<label class="crow"><input type="checkbox" id="${id}" name="${f.key}" ${v?'checked':''}><span class="box">${SVG.check}</span><span>${esc(f.label)}</span></label>`;
  let ctl;
  if(f.type==='select')ctl=`<select id="${id}" name="${f.key}">${f.options.map(o=>`<option${o===v?' selected':''}>${esc(o)}</option>`).join('')}</select>`;

function openForm({title,fields,values={},onSave,onDelete}){

      }catch(e){if(m)m.textContent='下載失敗，請稍後再試。'}
    },
    rm:()=>{closeSheet();mutate(()=>{const y=find(S[L.key],itemId);if(y)y.photos=(y.photos||[]).filter(q=>q.id!==p.id)},'已刪除檔案',true)}
  });
}
/* 拖曳／貼上上傳 */
const hasFiles=e=>!!(e.dataTransfer&&[...(e.dataTransfer.types||[])].includes('Files'));
const dropLi=e=>(e.target&&e.target.closest)?e.target.closest('#todo li[data-item]'):null;
const clearDrop=()=>$$('li.drop').forEach(x=>x.classList.remove('drop'));
document.addEventListener('dragover',e=>{
  if(!hasFiles(e))return;
  e.preventDefault();
  const li=dropLi(e);clearDrop();
  if(li){li.classList.add('drop');e.dataTransfer.dropEffect='copy'}else e.dataTransfer.dropEffect='none';
});
document.addEventListener('dragleave',e=>{if(!e.relatedTarget)clearDrop()});
document.addEventListener('drop',e=>{
  if(!hasFiles(e))return;
  e.preventDefault();clearDrop();
  const li=dropLi(e),files=[...e.dataTransfer.files];
  if(!li||!files.length)return;
  if(!ui.unlocked){askPw();return}
  uploadPhotos(files,{list:'todo',id:li.dataset.item});
});
document.addEventListener('paste',e=>{
  const files=[...((e.clipboardData&&e.clipboardData.files)||[])];
  if(!files.length||!$('#scrim').hidden)return;
  e.preventDefault();
  if(!ui.unlocked){askPw();return}
  if(!phSel||!find(S.todos,phSel)){toast('先點一下要加檔案的待辦項目，再貼上');return}
  uploadPhotos(files,{list:'todo',id:phSel});
});
document.addEventListener('click',e=>{
  const li=e.target.closest&&e.target.closest('#todo li[data-item]');
  if(!li||phSel===li.dataset.item)return;
  phSel=li.dataset.item;
  $$('#todo li.sel').forEach(x=>x.classList.remove('sel'));li.classList.add('sel');
});
$('#phInput').addEventListener('change',e=>{
  const files=[...e.target.files],t=phTarget;e.target.value='';phTarget=null;
  if(t&&files.length)uploadPhotos(files,t);
});
$('#editBtn').addEventListener('click',()=>{
  if(ui.editing){setEditing(false);return}
  if(ui.unlocked)setEditing(true);else askPw(()=>setEditing(true));
});

/* 選單：移到上方/下方、隱藏、可拖曳的圓形按鈕 */
let view='home';
const NK='tabi-techo-nav';
const navPref={pos:'top',hide:false,fx:null,fy:.4};
try{Object.assign(navPref,JSON.parse(localStorage.getItem(NK)||'{}'))}catch(e){}
const NAVS={flights:'航班',days:'行程',transit:'交通',explore:'看透透',todo:'待辦',hotels:'住宿',prep:'出發前',pack:'行李',notes:'注意事項',ledger:'記帳'};
const NAV_DEF=Object.keys(NAVS);
const navOff=k=>(k!=='ledger'&&navPref.hidden.includes(k))||(k==='flights'&&isDom())||(k==='ledger'&&!(S&&S.ledger));
navPref.order=(Array.isArray(navPref.order)?navPref.order:[]).filter(k=>NAVS[k]);
NAV_DEF.forEach(k=>{if(!navPref.order.includes(k))navPref.order.push(k)});
navPref.hidden=(Array.isArray(navPref.hidden)?navPref.hidden:[]).filter(k=>NAVS[k]);
function renderNav(){
  $('#nav').innerHTML='<a href="#top" data-nav="top" aria-label="封面">·</a>'+navPref.order.filter(k=>!navOff(k)).map(k=>`<a href="#${k}" data-nav="${k}">${NAVS[k]}</a>`).join('');
}
function applyOrder(){const main=$('main'),foot=$('#foot');navPref.order.filter(k=>k!=='ledger').forEach(k=>{const el=document.getElementById(k);if(el){main.insertBefore(el,foot);el.hidden=(k==='flights'&&isDom());el.classList.toggle('folded',navPref.hidden.includes(k))}})}
function refreshNav(){renderNav();applyOrder();fixGrid();applyNav();spyId='';spy()}
function lgOn(stay){mutate(()=>{if(!S.ledger)S.ledger={cur:LG_CUR[(curTrip()||{}).country]||'',members:[],items:[]};const i=navPref.hidden.indexOf('ledger');if(i>=0)navPref.hidden.splice(i,1);try{localStorage.setItem(NK,JSON.stringify(navPref))}catch(e){}},'已新增這個旅程的記帳／分帳分頁');refreshNav();if(!stay)setView('ledger')}
function openNavMenu(){
  const n=navPref.order.length;
  const rows=navPref.order.map((k,i)=>{if((k==='flights'&&isDom())||(k==='ledger'&&!S.ledger))return '';return `<li class="orgrow"><span class="txt">${NAVS[k]}</span><span class="eb"><button type="button" class="mini" data-sheet="up" data-k="${k}" aria-label="上移" ${i===0?'disabled':''}>↑</button><button type="button" class="mini" data-sheet="dn" data-k="${k}" aria-label="下移" ${i===n-1?'disabled':''}>↓</button></span></li>`}).join('');
  const redo=()=>{refreshNav();openNavMenu()};
  const move=(b,d)=>{const k=b.dataset.k,i=navPref.order.indexOf(k),j=i+d;if(j<0||j>=n)return;navPref.order.splice(i,1);navPref.order.splice(j,0,k);redo()};
  openSheet(`<h3 id="sheet-t">選單設定</h3><div style="display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:.8rem"><button type="button" class="btn sm" data-sheet="pos">選單移到${navPref.pos==='bottom'?'上方':'下方'}</button><button type="button" class="btn sm" data-sheet="hide" aria-label="隱藏整個選單"><span class="eyeb">${SVG.eyeOpen}<span>整個選單</span></span></button></div><p class="mut">用 ↑↓ 調整順序（頁面內容也會跟著換位置）。想隱藏某個區塊，請按該區塊大標題旁的眼睛圖示。設定只存在這台裝置。</p><ul class="rows orglist">${rows}</ul><div class="sheet-btns" style="margin-top:.8rem"><button type="button" class="btn" data-sheet="reset">還原預設</button><span class="sp"></span><button type="button" class="btn primary" data-sheet="close">完成</button></div>`,{
    pos:()=>{navPref.pos=navPref.pos==='bottom'?'top':'bottom';redo()},
    hide:()=>{navPref.hide=true;closeSheet();refreshNav();toast('選單已隱藏，點圓形按鈕可以叫回來，按住可以拖曳移動')},
    up:b=>move(b,-1),dn:b=>move(b,1),
    reset:()=>{navPref.order=NAV_DEF.slice();navPref.hidden=[];redo()}
  });
}
renderNav();applyOrder();
const nb=$('#navbar'),fab=$('#fab');
function applyNav(){
  nb.classList.toggle('bottom',navPref.pos==='bottom');
  const hid=navPref.hide&&view==='trip';
  nb.classList.toggle('hide',hid);
  fab.classList.toggle('on',hid);
  document.body.classList.toggle('navb',navPref.pos==='bottom'&&!hid);
  const y=Math.min(Math.max(8,Math.round(navPref.fy*innerHeight)),innerHeight-56);
  fab.style.top=y+'px';
  if(navPref.fx==null){fab.style.right='12px';fab.style.left='auto'}
  else{fab.style.left=Math.min(Math.max(8,Math.round(navPref.fx*innerWidth)),innerWidth-56)+'px';fab.style.right='auto'}
  try{localStorage.setItem(NK,JSON.stringify(navPref))}catch(e){}
}
function setView(v){view=v;document.body.dataset.view=v;applyNav();
  if(v==='home')renderHome();
  if(v==='ledger'){renderLedger();const t=$('#lgTrip');if(t)t.textContent=(S.trip.title||curTrip().name||'')}
  scrollTo({top:0});spyId='';
  if(v==='trip')setTimeout(()=>{try{spy();exMapObj&&exMapObj.invalidateSize()}catch(e){}},80)}
$('#navMenu').addEventListener('click',openNavMenu);
let drag=null;
fab.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,moved:false,ox:fab.offsetLeft,oy:fab.offsetTop};fab.setPointerCapture(e.pointerId)});
fab.addEventListener('pointermove',e=>{
  if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!drag.moved&&Math.hypot(dx,dy)<6)return;drag.moved=true;
  fab.style.left=Math.min(innerWidth-56,Math.max(8,drag.ox+dx))+'px';fab.style.right='auto';
  fab.style.top=Math.min(innerHeight-56,Math.max(8,drag.oy+dy))+'px';
});
fab.addEventListener('pointerup',()=>{
  if(!drag)return;const m=drag.moved;drag=null;
  if(m){navPref.fx=fab.offsetLeft/innerWidth;navPref.fy=fab.offsetTop/innerHeight}else navPref.hide=false;
  applyNav();
});
fab.addEventListener('pointercancel',()=>{drag=null});
fab.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();navPref.hide=false;applyNav()}});
applyNav();
const secIds=()=>['top',...navPref.order.filter(k=>!navOff(k)&&k!=='ledger')];let spyId='',raf=0;
function spy(){
  let cur='top';for(const id of secIds()){if(document.getElementById(id).getBoundingClientRect().top<=130)cur=id}
  if(cur===spyId)return;spyId=cur;
  $$('#nav a').forEach(a=>{const on=a.dataset.nav===cur;a.classList.toggle('on',on);on?a.setAttribute('aria-current','true'):a.removeAttribute('aria-current')});
  const a=$(`#nav a[data-nav="${cur}"]`),n=$('#nav');if(a)n.scrollTo({left:a.offsetLeft-n.clientWidth/2+a.offsetWidth/2,behavior:'auto'});
}
addEventListener('scroll',()=>{if(!raf)raf=requestAnimationFrame(()=>{raf=0;spy()})},{passive:true});

renderAll();spy();
setInterval(tick,1000);
initSync();
})();
</script>
